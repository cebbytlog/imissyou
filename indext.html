<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9fdcf2">
<title>A Little Farm for Jeam Abby Keith Panganiban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
--wood:#c98a3d; --wood-d:#8a5522; --wood-dd:#5a3413;
--parch:#f9e3ae; --parch-d:#ecc983; --ink:#4a2a12; --pink:#ff8fb1;
--hw:clamp(118px,33vw,190px);
--gap:clamp(26px,20vw,140px);
--px:4px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
margin:0; min-height:100svh; overflow-x:hidden;
font-family:'VT323','Courier New',monospace; font-size:24px; color:var(--ink);
background:#84c95a;
}
.spr{display:inline-block;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;flex:none}
button{font:inherit;color:inherit}

/* ---------- sky + header ---------- */
.top{
position:relative; z-index:1; overflow:hidden;
padding:clamp(18px,5vw,34px) 12px clamp(26px,6vw,44px);
background:linear-gradient(#8fd6f3 0%,#b8e8f4 55%,#e2f5e4 100%);
display:flex; justify-content:center;
}
.cloud{position:absolute;opacity:.95;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sign{
position:relative; z-index:2; display:block;
width:min(94vw,760px); height:auto;
filter:drop-shadow(0 6px 0 rgba(70,40,10,.28));
animation:signdrop 1.1s steps(9,end) both;
}
@keyframes signdrop{
0%{transform:translateY(-140%)}
58%{transform:translateY(7%)}
78%{transform:translateY(-3%)}
100%{transform:translateY(0)}
}

/* ---------- meadow ---------- */
.meadow{
position:relative; z-index:2; padding:0 0 90px; margin-top:0;
background-color:#84c95a; background-repeat:repeat; background-size:64px 64px;
image-rendering:pixelated; overflow-x:clip; isolation:isolate;
}
.meadow::before{
content:""; position:absolute; left:0; right:0; top:calc(var(--bushh) * -1 + 1px); height:var(--bushh);
background-repeat:repeat-x; background-size:auto 100%; image-rendering:pixelated; z-index:0; pointer-events:none;
}
.decor{position:absolute;inset:0;z-index:0;pointer-events:none}
.decor .spr{position:absolute}
.col{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;padding:0 12px}

/* ---------- chickens ---------- */
.stage{position:relative;width:100%;max-width:560px;padding:clamp(70px,22vw,110px) 0 18px;margin-top:6px}
.pair{display:flex;justify-content:center;align-items:flex-end;gap:var(--gap);position:relative}
.hen{
position:relative; width:var(--hw); flex:none;
transition:transform 1.1s cubic-bezier(.4,.1,.3,1);
animation:pop .5s steps(4,end) both;
}
.hen.cream{animation-delay:.9s}.hen.brown{animation-delay:.75s}
@keyframes pop{from{scale:0;opacity:0}to{scale:1;opacity:1}}
.shadow{position:absolute;left:12%;right:12%;bottom:-6px;height:14px;border-radius:50%;background:rgba(40,70,20,.28);z-index:0}
.bob{position:relative;z-index:1;transform-origin:50% 100%;animation:bob 1.1s steps(1,end) infinite}
.cream .bob{animation-delay:-.55s}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(calc(var(--hw) * -.03))}}
.hen img{display:block;width:100%;height:auto;image-rendering:pixelated;transform-origin:50% 100%;user-select:none;-webkit-user-drag:none}
.brown img{animation:peckR 5.5s steps(1,end) infinite}
.cream img{animation:peckL 6.3s steps(1,end) infinite}
@keyframes peckR{0%,86%{transform:rotate(0)}88%{transform:rotate(9deg) translateY(4%)}91%{transform:rotate(0)}93%{transform:rotate(9deg) translateY(4%)}96%,100%{transform:rotate(0)}}
@keyframes peckL{0%,70%{transform:rotate(0)}72%{transform:rotate(-9deg) translateY(4%)}75%{transform:rotate(0)}77%{transform:rotate(-9deg) translateY(4%)}80%,100%{transform:rotate(0)}}

/* YES /
.love .brown{transform:translateX(calc(var(--gap)/2 + var(--hw).02))}
.love .cream{transform:translateX(calc((var(--gap)/2 + var(--hw)*.02) * -1))}
.love .bob{animation:hop .36s ease-out 3}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--hw) * -.12))}}
.love .hen img{animation:none}
.love.kiss .brown .bob{animation:smoochR 1.4s steps(1,end) infinite}
.love.kiss .cream .bob{animation:smoochL 1.4s steps(1,end) infinite}
@keyframes smoochR{0%{transform:rotate(7deg)}50%{transform:rotate(11deg) translateX(3%)}}
@keyframes smoochL{0%{transform:rotate(-7deg)}50%{transform:rotate(-11deg) translateX(-3%)}}

/* NO /
.sad .brown .bob{animation:none;transform:rotate(13deg) translateY(7%) scaleY(.93)}
.sad .cream .bob{animation:confused 1.7s steps(4,end) infinite}
.sad .hen img{animation:none}
@keyframes confused{0%{transform:rotate(-9deg)}25%{transform:rotate(0)}50%{transform:rotate(9deg)}75%{transform:rotate(0)}100%{transform:rotate(-9deg)}}
.mood{position:absolute;display:none;pointer-events:none}
.sad .mood{display:block}
.raincloud{left:50%;top:-52%;transform:translateX(-30%);width:calc(var(--hw).8)}
.rain{position:absolute;top:70%;width:4px;height:12px;background:#6ec5ff;box-shadow:0 0 0 2px rgba(255,255,255,.5) inset;animation:rain .9s linear infinite}
@keyframes rain{from{transform:translateY(0);opacity:1}to{transform:translateY(calc(var(--hw).75));opacity:.2}}
.tear{left:67%;top:30%;animation:tear 1.2s steps(6,end) infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(calc(var(--hw).35));opacity:0}}
.qmark{
font-family:'Press Start 2P',monospace;font-size:clamp(14px,4.4vw,22px);color:#fff;
background:#7a5ad8;border:3px solid #3d2b8a;padding:6px 8px;left:12%;top:-34%;animation:qpop 1.7s steps(1,end) infinite
}
.qmark.b{left:48%;top:-52%;animation-delay:-.85s;background:#e0577f;border-color:#8f2a46}
@keyframes qpop{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.15)}}

/* effects layer */
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.fx .spr{position:absolute}
.fh{animation:floatup 2.4s ease-out forwards}
@keyframes floatup{
0%{transform:translate(-50%,0) scale(.4);opacity:0}
15%{opacity:1;transform:translate(-50%,-10px) scale(1)}
55%{transform:translate(calc(-50% + 12px),-52px) scale(1)}
100%{transform:translate(calc(-50% - 8px),-110px) scale(.9);opacity:0}
}
.fs{animation:twinkle 1.1s steps(5,end) forwards}
@keyframes twinkle{0%{transform:translate(-50%,-50%) scale(0);opacity:0}40%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-60%) scale(0);opacity:0}}
.fbig{animation:bigheart 1.8s steps(8,end) forwards}
@keyframes bigheart{0%{transform:translate(-50%,0) scale(0)}25%{transform:translate(-50%,-14px) scale(1.15)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.mwah{font-family:'Press Start 2P',monospace;font-size:clamp(10px,3vw,14px);color:#fff;text-shadow:2px 2px 0 #c2447a,-2px -2px 0 #c2447a,2px -2px 0 #c2447a,-2px 2px 0 #c2447a;animation:floatup 1.9s ease-out forwards;white-space:nowrap}

/* ---------- dialogue box ---------- */
.dlg{
position:relative; z-index:3; width:min(92vw,520px); margin:22px auto 0;
background:var(--parch); border:4px solid var(--wood-dd);
box-shadow:0 0 0 4px var(--wood),0 0 0 8px var(--wood-dd),0 12px 0 8px rgba(40,20,5,.28);
padding:20px 16px 20px; text-align:center;
}
.dlg::before,.dlg::after{content:"";position:absolute;width:10px;height:10px;background:var(--wood-dd);top:8px}
.dlg::before{left:8px}.dlg::after{right:8px}
.q{margin:6px 0 4px;font-family:'Press Start 2P',monospace;font-size:clamp(14px,4.4vw,20px);line-height:1.6;color:var(--ink)}
.msg{min-height:3.1em;margin:10px 4px 14px;font-size:clamp(24px,6.4vw,30px);line-height:1.1;color:#8b3550;display:flex;align-items:center;justify-content:center}
.btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{
font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.6vw,16px);
padding:14px 20px;border:4px solid var(--wood-dd);cursor:pointer;min-width:122px;
box-shadow:inset 0 4px 0 rgba(255,255,255,.38),inset 0 -4px 0 rgba(0,0,0,.18),0 6px 0 var(--wood-dd);
transition:transform .06s steps(1);
}
.btn.yes{background:#86d85f;color:#1d3d10}
.btn.no{background:#f0705f;color:#4a0f08}
.btn:active{transform:translateY(4px);box-shadow:inset 0 4px 0 rgba(255,255,255,.38),inset 0 -4px 0 rgba(0,0,0,.18),0 2px 0 var(--wood-dd)}
.btn:focus-visible,.mailbox:focus-visible,.music:focus-visible,.close:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px #3d2b8a}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- mailbox ---------- */
.yard{position:relative;z-index:3;margin-top:clamp(64px,14vw,90px);display:flex;justify-content:center;width:100%}
.mbwrap{position:relative;padding-top:78px}
.mailbox{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mb-art{position:relative;display:block}
.mb-art>.spr{position:absolute}
.mb-body{z-index:2;left:0;top:0}
.mb-door{z-index:3;transform-origin:50% 100%;transition:transform .5s steps(5,end)}
.mb-peek{z-index:1;left:0;top:0;transition:transform .9s steps(7,end) .35s}
.mb-flag{z-index:3;transition:transform .45s steps(4,end)}
.mailbox.open .mb-door{transform:scaleY(.16)}
.mailbox.open .mb-peek{transform:translateY(calc(var(--mpx) * -9))}
.mailbox.read .mb-flag,.mailbox.open .mb-flag{transform:rotate(-90deg)}
.mailbox:not(.open):hover .mb-art{animation:wiggle .5s steps(1,end) 2}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.bubble{
position:absolute;left:50%;top:0;transform:translateX(-50%);
white-space:nowrap;background:var(--parch);border:4px solid var(--wood-dd);box-shadow:0 0 0 3px var(--wood);
padding:7px 12px 8px;font-size:clamp(22px,5.6vw,26px);line-height:1;z-index:4;cursor:pointer;
animation:bubble 1.1s steps(1,end) infinite;
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-17px;margin-left:-8px;border:8px solid transparent;border-top:9px solid var(--wood-dd)}
.bubble::before{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-5px;border:5px solid transparent;border-top:6px solid var(--parch);z-index:1}
@keyframes bubble{0%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.bubble[hidden]{display:none}

/* ---------- letter modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;background:rgba(40,22,8,.6)}
.modal[hidden]{display:none}
.letter{
width:min(94vw,560px);max-height:90svh;overflow:auto;position:relative;
background-color:var(--parch);
background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(138,85,34,.2) 31px 32px);
border:4px solid var(--wood-dd);box-shadow:0 0 0 4px var(--wood),0 0 0 8px var(--wood-dd),0 14px 0 8px rgba(0,0,0,.3);
padding:22px 22px 22px;animation:unfold .6s steps(6,end) both;
}
@keyframes unfold{from{transform:translateY(40px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.letter h2{margin:0 0 18px;font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.6vw,15px);line-height:2;color:#8b3550;text-align:center;background:var(--parch)}
.letter p{margin:0 0 32px;font-size:clamp(24px,6.6vw,27px);line-height:32px}
.letter p.sig{margin-bottom:22px;color:#8b3550}
.close{
display:block;margin:0 auto;font-family:'Press Start 2P',monospace;font-size:13px;padding:12px 18px;background:#f4b855;color:#4a2a12;
border:4px solid var(--wood-dd);cursor:pointer;
box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.18),0 5px 0 var(--wood-dd)
}
.close:active{transform:translateY(3px)}

/* ---------- ambient + music ---------- */
.amb{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.amb .spr{position:absolute}
.rise{animation:rise linear forwards}
@keyframes rise{from{transform:translate(0,0)}50%{transform:translate(16px,-55vh)}to{transform:translate(-8px,-115vh)}}
.fall{animation:fall linear forwards}
@keyframes fall{from{transform:translate(0,0) rotate(0)}50%{transform:translate(28px,55vh) rotate(160deg)}to{transform:translate(-10px,112vh) rotate(320deg)}}
.bf{position:absolute;animation:fly linear infinite}
.bf .spr{position:absolute;left:0;top:0}
.bf .f1{animation:fl1 .5s steps(1,end) infinite}
.bf .f2{animation:fl2 .5s steps(1,end) infinite}
@keyframes fl1{0%{opacity:1}50%{opacity:0}}
@keyframes fl2{0%{opacity:0}50%{opacity:1}}
@keyframes fly{
0%{transform:translate(-60px,0)}
25%{transform:translate(28vw,-40px)}
50%{transform:translate(55vw,30px)}
75%{transform:translate(82vw,-30px)}
100%{transform:translate(112vw,10px)}
}
.music{
position:fixed;z-index:40;bottom:12px;right:10px;font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.4;
padding:9px 10px;background:var(--parch);border:4px solid var(--wood-dd);box-shadow:0 0 0 3px var(--wood),0 4px 0 3px var(--wood-dd);cursor:pointer;color:var(--ink)
}
.music[aria-pressed="true"]{background:#b9f0a0}

@media (prefers-reduced-motion:reduce){
,::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;animation-delay:0s!important}
.amb,.cloud{display:none}
}
</style>
</head>
<body>
