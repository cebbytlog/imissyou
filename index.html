<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4a9e">
<title>A Little Farm for Jeam Abby Keith Panganiban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#c98a3d; --wood-d:#8a5522; --wood-dd:#5a3413;
  --parch:#f9e3ae; --parch-d:#ecc983; --ink:#4a2a12; --pink:#ff8fb1;
  --hw:clamp(118px,33vw,190px);
  --gap:clamp(26px,20vw,140px);
  --px:4px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100svh; overflow-x:hidden;
  font-family:'VT323','Courier New',monospace; font-size:24px; color:var(--ink);
  background:#84c95a;
}
.spr{display:inline-block;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;flex:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- sky + header ---------- */
.top{
  position:relative; z-index:1; overflow:hidden;
  --sun:clamp(120px,28vw,210px);
  padding:clamp(26px,6vw,46px) 12px calc(var(--sun)*.7 + 56px);
  background:linear-gradient(#6c4a9e 0%,#c9648f 38%,#ff9a6b 72%,#ffd27a 100%);
  display:flex; justify-content:center;
}
.sun{position:absolute;z-index:0;left:50%;bottom:calc(var(--sun)/-3 + 44px);width:var(--sun);aspect-ratio:1;margin-left:calc(var(--sun)/-2);background:#fff1a8;border-radius:50%;box-shadow:0 0 0 12px #ffe08a88,0 0 0 28px #ffc46a55,0 0 80px 40px #ffb36b66;animation:sunbob 6s steps(6) infinite alternate}
@keyframes sunbob{to{transform:translateY(6px)}}
.cloud{position:absolute;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sign{
  position:relative; z-index:2; display:block;
  width:min(94vw,760px); height:auto;
  filter:drop-shadow(0 6px 0 rgba(70,40,10,.28));
  visibility:hidden;
}
body.go .sign{visibility:visible;animation:signdrop 1.1s steps(9,end) both}
@keyframes signdrop{
  0%{transform:translateY(-140%)}
  58%{transform:translateY(7%)}
  78%{transform:translateY(-3%)}
  100%{transform:translateY(0)}
}

/* ---------- meadow ---------- */
.meadow{
  position:relative; z-index:2; padding:0 0 90px; margin-top:0;
  background-color:#84c95a; background-repeat:repeat; background-size:64px 64px;
  image-rendering:pixelated; overflow-x:clip; isolation:isolate;
}
.meadow::before{
  content:""; position:absolute; left:0; right:0; top:calc(var(--bushh) * -1 + 1px); height:var(--bushh);
  background-repeat:repeat-x; background-size:auto 100%; image-rendering:pixelated; z-index:0; pointer-events:none;
}
.decor{position:absolute;inset:0;z-index:0;pointer-events:none}
.decor .spr{position:absolute}
.col{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;padding:0 12px}

/* ---------- chickens: no idle animation; they only walk together and kiss ---------- */
.stage{position:relative;width:100%;max-width:560px;padding:clamp(80px,24vw,120px) 0 18px;margin-top:6px}
.pair{display:flex;justify-content:center;align-items:flex-end;gap:var(--gap);position:relative}
.hen{position:relative;width:var(--hw);flex:none;transition:transform 1.4s steps(8,end)}
.shadow{position:absolute;left:12%;right:12%;bottom:-6px;height:14px;border-radius:50%;background:rgba(40,70,20,.28);z-index:0}
.bob{position:relative;z-index:1;transform-origin:50% 100%}
.hen img{display:block;width:100%;height:auto;image-rendering:pixelated;user-select:none;-webkit-user-drag:none}

/* YES: walk toward each other until the beaks meet */
.love .brown{transform:translateX(calc(var(--gap)/2 - var(--hw)*.03))}
.love .cream{transform:translateX(calc((var(--gap)/2 - var(--hw)*.03) * -1))}

/* NO: static sad / confused poses */
.sad .brown .bob{transform:rotate(13deg) translateY(7%) scaleY(.93)}
.sad .cream .bob{transform:rotate(-9deg)}
.mood{position:absolute;display:none;pointer-events:none}
.sad .mood{display:block}
.raincloud{left:50%;top:-52%;transform:translateX(-30%);width:calc(var(--hw)*.8)}
.rain{position:absolute;top:70%;width:4px;height:12px;background:#6ec5ff;box-shadow:0 0 0 2px rgba(255,255,255,.5) inset;animation:rain .9s linear infinite}
@keyframes rain{from{transform:translateY(0);opacity:1}to{transform:translateY(calc(var(--hw)*.75));opacity:.2}}
.tear{left:67%;top:30%;animation:tear 1.2s steps(6,end) infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(calc(var(--hw)*.35));opacity:0}}
.qmark{font-family:'Press Start 2P',monospace;font-size:clamp(14px,4.4vw,22px);color:#fff;background:#7a5ad8;border:3px solid #3d2b8a;padding:6px 8px;left:12%;top:-34%}
.qmark.b{left:48%;top:-52%;background:#e0577f;border-color:#8f2a46}

/* effects layer */
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.fx .spr{position:absolute}
.fh{animation:floatup 2.4s ease-out forwards}
@keyframes floatup{
  0%{transform:translate(-50%,0) scale(.4);opacity:0}
  15%{opacity:1;transform:translate(-50%,-10px) scale(1)}
  55%{transform:translate(calc(-50% + 12px),-52px) scale(1)}
  100%{transform:translate(calc(-50% - 8px),-110px) scale(.9);opacity:0}
}
.fs{animation:twinkle 1.1s steps(5,end) forwards}
@keyframes twinkle{0%{transform:translate(-50%,-50%) scale(0);opacity:0}40%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-60%) scale(0);opacity:0}}
.fpulse{transform:translateX(-50%);animation:pulse .8s steps(2,end) infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.25)}}
.mwah{font-family:'Press Start 2P',monospace;font-size:clamp(10px,3vw,14px);color:#fff;text-shadow:2px 2px 0 #c2447a,-2px -2px 0 #c2447a,2px -2px 0 #c2447a,-2px 2px 0 #c2447a;animation:floatup 1.9s ease-out forwards;white-space:nowrap}

/* ---------- dialogue box + buttons (from the Pelican Town letter) ---------- */
.dlg{
  position:relative;z-index:3;width:min(92vw,520px);margin:30px auto 0;
  background:#fbe7b5;border:5px solid #8a4b1e;outline:4px solid #5a2f10;border-radius:6px;
  box-shadow:inset 0 0 0 4px #f3cf86,0 8px 0 #5a2f10;
  padding:20px 24px 24px;min-height:132px;
  font-family:"Courier New",ui-monospace,monospace;font-weight:700;color:#4a2a10;
  font-size:clamp(15px,4.2vw,20px);line-height:1.45;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.tag{position:absolute;top:-24px;left:14px;background:#8a4b1e;color:#ffe9b8;padding:2px 10px;font-size:13px;border:3px solid #5a2f10;line-height:1.4}
.nx{position:absolute;right:10px;bottom:4px;color:#8a4b1e;animation:nx .6s steps(2) infinite}
@keyframes nx{50%{transform:translateY(3px)}}
.q{margin:0;font-size:clamp(17px,5vw,22px);line-height:1.5;min-height:3em;display:flex;align-items:center;justify-content:center}
.msg{margin:6px 0 0;min-height:2.9em;display:flex;align-items:center;justify-content:center}
.btns{position:relative;z-index:3;display:flex;gap:18px;margin-top:26px;align-items:center;justify-content:center;flex-wrap:wrap}
.pb{
  font-family:"Courier New",ui-monospace,monospace;font-weight:700;font-size:clamp(16px,4.6vw,21px);
  padding:12px 22px;border:4px solid #5a2f10;border-radius:4px;cursor:pointer;color:#fff;text-shadow:2px 2px 0 #0003;
  box-shadow:inset 0 -6px 0 #0003,0 6px 0 #5a2f10;transition:transform .1s steps(2);min-width:120px
}
.pb:hover{transform:translateY(-2px)}
.pb:active{transform:translateY(4px);box-shadow:inset 0 -6px 0 #0003,0 2px 0 #5a2f10}
.pb:focus-visible,.mailbox:focus-visible,.music:focus-visible,.close:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px #3d2b8a}
#yes{background:#3fae5a}#no{background:#d9605a}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- mailbox ---------- */

.yard{position:relative;z-index:3;margin-top:clamp(56px,12vw,80px);display:flex;justify-content:center;width:100%}
.scene{position:relative;width:min(92vw,360px);padding-top:84px;display:flex;justify-content:space-between;align-items:flex-end}
.cabin{position:relative;flex:none}
.cabin .spr{display:block}
.smoke{position:absolute;width:8px;height:8px;background:#fff;opacity:0;animation:smoke 3.4s steps(7) infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translate(12px,-52px) scale(1.7);opacity:0}}
.mbwrap{position:relative;flex:none}
.mailbox{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mb-art{position:relative;display:block}
.mb-art>.spr{position:absolute}
.mb-body{z-index:2;left:0;top:0}
.mb-door{z-index:3;transform-origin:50% 100%;transition:transform .5s steps(5,end)}
.mb-peek{z-index:1;left:0;top:0;transition:transform .9s steps(7,end) .35s}
.mb-flag{z-index:3;transition:transform .45s steps(4,end)}
.mailbox.open .mb-door{transform:scaleY(.16)}
.mailbox.open .mb-peek{transform:translateY(calc(var(--mpx) * -9))}
.mailbox.read .mb-flag,.mailbox.open .mb-flag{transform:rotate(-90deg)}
.mailbox:not(.open):hover .mb-art{animation:wiggle .5s steps(1,end) 2}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.bubble{
  position:absolute;right:0;top:0;white-space:nowrap;background:var(--parch);border:4px solid var(--wood-dd);box-shadow:0 0 0 3px var(--wood);
  padding:7px 12px 8px;font-size:clamp(22px,5.6vw,26px);line-height:1;z-index:4;cursor:pointer;
  animation:bubble 1.1s steps(1,end) infinite;font-family:'VT323','Courier New',monospace;color:var(--ink)
}

.bubble::after{content:"";position:absolute;right:var(--tail,32px);bottom:-17px;border:8px solid transparent;border-top:9px solid var(--wood-dd)}
.bubble::before{content:"";position:absolute;right:calc(var(--tail,32px) + 3px);bottom:-11px;border:5px solid transparent;border-top:6px solid var(--parch);z-index:1}
@keyframes bubble{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}}
.bubble[hidden]{display:none}

/* ---------- letter modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;background:rgba(40,22,8,.6)}
.modal[hidden]{display:none}
.letter{
  width:min(94vw,560px);max-height:90svh;overflow:auto;position:relative;
  background-color:var(--parch);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(138,85,34,.2) 31px 32px);
  border:4px solid var(--wood-dd);box-shadow:0 0 0 4px var(--wood),0 0 0 8px var(--wood-dd),0 14px 0 8px rgba(0,0,0,.3);
  padding:22px 22px 22px;animation:unfold .6s steps(6,end) both;
}
@keyframes unfold{from{transform:translateY(40px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.letter h2{margin:0 0 18px;font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.6vw,15px);line-height:2;color:#8b3550;text-align:center;background:var(--parch)}
.letter p{margin:0 0 32px;font-size:clamp(24px,6.6vw,27px);line-height:32px}
.letter p.sig{margin-bottom:22px;color:#8b3550}
.close{
  display:block;margin:0 auto;font-family:'Press Start 2P',monospace;font-size:13px;padding:12px 18px;background:#f4b855;color:#4a2a12;
  border:4px solid var(--wood-dd);cursor:pointer;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.18),0 5px 0 var(--wood-dd)
}
.close:active{transform:translateY(3px)}

/* ---------- ambient + music ---------- */
.amb{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.amb .spr{position:absolute}
.rise{animation:rise linear forwards}
@keyframes rise{from{transform:translate(0,0)}50%{transform:translate(16px,-55vh)}to{transform:translate(-8px,-115vh)}}
.fall{animation:fall linear forwards}
@keyframes fall{from{transform:translate(0,0) rotate(0)}50%{transform:translate(28px,55vh) rotate(160deg)}to{transform:translate(-10px,112vh) rotate(320deg)}}
.bf{position:absolute;animation:fly linear infinite}
.bf .spr{position:absolute;left:0;top:0}
.bf .f1{animation:fl1 .5s steps(1,end) infinite}
.bf .f2{animation:fl2 .5s steps(1,end) infinite}
@keyframes fl1{0%{opacity:1}50%{opacity:0}}
@keyframes fl2{0%{opacity:0}50%{opacity:1}}
@keyframes fly{
  0%{transform:translate(-60px,0)}
  25%{transform:translate(28vw,-40px)}
  50%{transform:translate(55vw,30px)}
  75%{transform:translate(82vw,-30px)}
  100%{transform:translate(112vw,10px)}
}
.music{
  position:static;font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.4;
  padding:9px 10px;background:var(--parch);border:4px solid var(--wood-dd);box-shadow:0 0 0 3px var(--wood),0 4px 0 3px var(--wood-dd);cursor:pointer;color:var(--ink)
}
.music[aria-pressed="true"]{background:#b9f0a0}
.ctrl{position:fixed;z-index:40;bottom:10px;right:8px;display:flex;flex-direction:row;gap:8px;align-items:center}
.ctrl .music{font-size:9px;padding:7px 8px;box-shadow:0 0 0 2px var(--wood),0 3px 0 2px var(--wood-dd);border-width:3px}
.start{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:linear-gradient(#6c4a9e 0%,#c9648f 45%,#ff9a6b 78%,#ffd27a 100%);transition:opacity .5s steps(5)}
.start.out{opacity:0;pointer-events:none}
.start .dlg{margin:0}
.start .btns{margin-top:26px}
.lfoot{position:sticky;bottom:-22px;margin:18px -22px -22px;padding:12px 22px 22px;background:var(--parch);border-top:4px solid var(--wood-d);display:flex;justify-content:space-between;align-items:center;gap:10px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.pager span{font-family:'Press Start 2P',monospace;font-size:11px;color:#8b3550}
.nav{font-family:'Press Start 2P',monospace;font-size:11px;padding:10px 10px;background:#f4b855;color:#4a2a12;border:4px solid var(--wood-dd);cursor:pointer;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 0 var(--wood-dd)}
.nav:disabled{opacity:.35;cursor:default}
.lfoot .close{margin:0 0 0 auto}
.letter .inhint{font-family:'Courier New',monospace;font-weight:700;font-size:clamp(14px,4vw,17px);line-height:24px;text-align:center;margin:0 0 20px;color:#6b3a1a}
.mail{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:0 0 16px;padding:12px 14px;background:#fff3cf;border:4px solid var(--wood-dd);box-shadow:inset 0 0 0 3px #f3cf86,0 5px 0 var(--wood-dd);cursor:pointer;font-family:'Courier New',monospace;font-weight:700;font-size:clamp(15px,4.4vw,19px);color:var(--ink);line-height:1.25}
.mail:hover{transform:translateY(-2px)}
.mail:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px #3d2b8a}
.mail.done{background:#f3e2b0}
.mail .new{margin-left:auto;flex:none;background:#d9605a;color:#fff;font-size:11px;padding:4px 7px;border:3px solid #5a2f10;animation:newblink .9s steps(1) infinite}
@keyframes newblink{50%{background:#ff8f6b}}
.nav:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px #3d2b8a}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;animation-delay:0s!important}
  .amb,.cloud{display:none}
}
</style>
</head>
<body>

<div class="ctrl">
  <button class="music" id="music" type="button" aria-pressed="false">&#9834; Music: OFF</button>
  <button class="music" id="sfx" type="button" aria-pressed="true">&#9835; Sound: ON</button>
</div>

<div class="start" id="start" role="dialog" aria-label="Start">
  <section class="dlg">
    <span class="tag">Psst...</span>
    <p class="q">Someone made a little farm just for you.</p>
    <span class="nx" aria-hidden="true">▼</span>
  </section>
  <div class="btns"><button class="pb" id="startBtn" type="button" style="background:#3fae5a">TAP TO OPEN 💌</button></div>
</div>

<header class="top" id="top">
  <div class="sun" aria-hidden="true"></div>
  <img class="sign" src="assets/sign.png" alt="Wooden sign reading JEAM ABBY KEITH PANGANIBAN" width="1100" height="488">
</header>

<main class="meadow" id="meadow">
  <div class="decor" id="decor" aria-hidden="true"></div>
  <div class="col">

    <section class="stage" id="stage" aria-label="Two chickens on the farm">
      <div class="pair">
        <div class="hen brown" id="henB">
          <span class="shadow"></span>
          <div class="bob"><img src="assets/brown.png" alt="Brown pixel chicken" width="960" height="960"></div>
          <span class="mood raincloud" id="raincloud"></span>
          <span class="mood tear" id="tear"></span>
        </div>
        <div class="hen cream" id="henC">
          <span class="shadow"></span>
          <div class="bob"><img src="assets/cream.png" alt="Cream pixel chicken" width="329" height="330"></div>
          <span class="mood qmark">?</span>
          <span class="mood qmark b">?</span>
        </div>
      </div>
      <div class="fx" id="fx" aria-hidden="true"></div>
    </section>

    <section class="dlg" id="box" aria-label="Do you miss me?">
      <span class="tag">Someone special</span>
      <p class="q" id="q" aria-live="polite">Do you miss me?</p>
      <span class="nx" aria-hidden="true">▼</span>
    </section>
    <div class="btns">
      <button class="pb" id="yes" type="button">💚 YES</button>
      <button class="pb" id="no" type="button">❤️ NO</button>
    </div>

    <section class="yard" aria-label="Cabin and mailbox">
      <div class="scene" id="scene">
        <button class="bubble" id="bubble" type="button" tabindex="-1" aria-hidden="true">You have 3 messages! 💌</button>
        <div class="cabin" id="cabin" aria-hidden="true"></div>
        <div class="mbwrap" id="mbwrap">
          <button class="mailbox" id="mailbox" type="button" aria-label="You have 3 messages! Open the mailbox"></button>
        </div>
      </div>
    </section>

  </div>
</main>

<div class="amb" id="amb" aria-hidden="true"></div>

<div class="modal" id="modal" hidden>
  <div class="letter" role="dialog" aria-modal="true" aria-label="Mailbox" id="letter">
    <div id="inbox">
      <h2>Your Mailbox 📬</h2>
      <p class="inhint" id="inhint">Tap each mail to open it 💌</p>
      <div id="mlist"></div>
    </div>
    <div id="reader" hidden>
      <h2 id="ltitle"></h2>
      <div id="lbody"></div>
    </div>
    <div class="lfoot">
      <button class="nav" id="back" type="button" hidden>◀ BACK</button>
      <button class="close" id="close" type="button">CLOSE</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const small=innerWidth<520;

/* ---------- tiny pixel sprite engine (SVG data URIs) ---------- */
const PAL={k:'#3a2214',r:'#d2432c',R:'#8f2a1c',l:'#ee6a4d',y:'#ffd93a',Y:'#d99a1e',w:'#fff6dd',g:'#4b9b3a',G:'#2e6a2b',h:'#82c957',b:'#9a6431',B:'#5a3418',t:'#d9a25a',p:'#ff8fb1',P:'#d9557f',o:'#f08a3c',s:'#c4cfe2',S:'#8892a6',u:'#6ec5ff',c:'#ffe6b0',L:'#98dc70'};
function sprite(rows,over){
  const pal=Object.assign({},PAL,over||{}),h=rows.length,w=rows[0].length;let r='';
  rows.forEach((row,y)=>{let x=0;while(x<w){const ch=row[x];if(ch==='.'||!pal[ch]){x++;continue}let e=x;while(e<w&&row[e]===ch)e++;r+=`<rect x="${x}" y="${y}" width="${e-x}" height="1" fill="${pal[ch]}"/>`;x=e}});
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${r}</svg>`;
  return {url:'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")',w,h};
}
function el(s,px,cls){const d=document.createElement('span');d.className='spr'+(cls?' '+cls:'');d.style.width=s.w*px+'px';d.style.height=s.h*px+'px';d.style.backgroundImage=s.url;return d}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- sprite art ---------- */

const meadow=$('#meadow'),decor=$('#decor');
(function(){
  const R=rng(7),rows=[];
  for(let y=0;y<16;y++){rows.push('hhhhhhhhhhhhhhhh')}
  const a=rows.map(r=>r.split(''));
  for(let i=0;i<9;i++){const x=Math.floor(R()*14),y=Math.floor(R()*15);a[y][x]='g';a[y][x+1]='g';if(y>0)a[y-1][x]='g'}
  for(let i=0;i<7;i++){const x=Math.floor(R()*15),y=Math.floor(R()*15);a[y][x]='L'}
  const tile=sprite(a.map(r=>r.join('')),{h:'#86cc5b',g:'#6db849',L:'#9adf72'});
  meadow.style.backgroundImage=tile.url;
  const bpx=small?4:5,MW=96,MH=16;
  function mountains(){
    const g=Array.from({length:MH},()=>Array(MW).fill('.'));
    const layers=[
      {peaks:[[10,15],[38,13],[70,14]],f:'m',d:'M',snow:true,slope:.85},
      {peaks:[[24,8],[56,10],[86,9]],f:'n',d:'N',snow:false,slope:1}
    ];
    layers.forEach(L=>{
      for(let x=0;x<MW;x++){
        let best=2,side=0,pk=0;
        L.peaks.forEach(([px,h])=>{
          let dx=x-px;if(dx>MW/2)dx-=MW;if(dx<-MW/2)dx+=MW;
          const v=Math.floor(h-Math.abs(dx)*L.slope);
          if(v>best){best=v;side=dx;pk=h}
        });
        const top=MH-best;
        for(let y=top;y<MH;y++){
          let c=side>0?L.d:L.f;
          if(L.snow&&best>pk-4&&y<top+3)c='w';
          g[y][x]=c;
        }
      }
    });
    return sprite(g.map(r=>r.join('')),{m:'#a77fc4',M:'#8a62ab',n:'#6f4f9e',N:'#583d84',w:'#ffe9f1'});

let ac=null,sfxBus=null,musicBus=null,sfxOn=true,noiseBuf=null;
function unlock(){
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();sfxBus=ac.createGain();sfxBus.gain.value=.55;sfxBus.connect(ac.destination);
    musicBus=ac.createGain();musicBus.gain.value=0;musicBus.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.3),ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended')ac.resume();
}
function tone(f,t0,dur,type,vol,f2){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(sfxBus);o.start(t0);o.stop(t0+dur+.03);
}
function noise(t0,dur,vol,freq){
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t0);s.stop(t0+dur);
}
const SFX=fn=>()=>{if(sfxOn&&ac)fn(ac.currentTime)};

function typeText(node,text,cb){
  clearInterval(node._t);node.textContent='';
  const ch=Array.from(text);let i=0;
  if(reduce){node.textContent=text;if(cb)cb();return}
  node._t=setInterval(()=>{
    const c=ch[i++];node.textContent=ch.slice(0,i).join('');
    if(c!==' '&&i%2===0)blip();
    if(i>=ch.length){clearInterval(node._t);if(cb)cb()}

}

function cabinSprite(){
  const W=32,H=28,g=Array.from({length:H},()=>Array(W).fill('.'));
  const px=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<H)g[y][x]=c};
  const rect=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x+i,y+j,c)};
  // chimney
  rect(22,0,4,9,'S');for(let y=0;y<9;y++){px(22,y,'k');px(25,y,'k')}rect(22,0,4,1,'k');
  // log walls
  rect(3,13,26,14,'b');
  for(const y of [15,18,21,24])rect(3,y,26,1,'B');
  for(let y=13;y<27;y++){px(3,y,'k');px(28,y,'k')}
  // roof (stepped triangle)
  for(let y=2;y<=12;y++){
    const hw=Math.min(16,Math.round(3+(y-2)*1.45)),x0=16-hw,x1=15+hw;
    for(let x=x0;x<=x1;x++)px(x,y,(y%2===0)?'r':'R');
    for(let x=x0+1;x<x1;x+=3)px(x,y,'l');
    px(x0,y,'k');px(x1,y,'k');
  }
  for(let x=0;x<W;x++){px(x,12,'k')}
  for(let x=1;x<W-1;x++)px(x,13,'B');
  rect(14,2,4,1,'k');
  // door
  rect(13,18,6,9,'B');for(let y=18;y<27;y++){px(13,y,'k');px(18,y,'k')}rect(13,18,6,1,'k');
  px(16,22,'t');px(16,23,'t');px(17,23,'y');
  rect(12,27,8,1,'t');
  // windows (warm glow)
  for(const x of [5,21]){
    rect(x,17,6,5,'y');rect(x,17,6,1,'k');rect(x,21,6,1,'k');
    for(let y=17;y<22;y++){px(x,y,'k');px(x+5,y,'k')}
    for(let y=18;y<21;y++)px(x+2,y,'w'),px(x+3,y,'w');
    rect(x-1,22,8,2,'B');px(x,22,'p');px(x+2,22,'y');px(x+4,22,'p');px(x+6,22,'w');
    px(x,21,'g');px(x+3,21,'g');px(x+5,21,'g');
  }
  // foundation
  rect(2,27,28,1,'S');
  return sprite(g.map(r=>r.join('')),{S:'#9aa0ad'});
}
(function(){
  const CP=small?4:5,C=cabinSprite(),cab=$('#cabin');
  cab.style.width=C.w*CP+'px';cab.style.height=C.h*CP+'px';
  cab.appendChild(el(C,CP));
  for(let i=0;i<3;i++){const s=document.createElement('i');s.className='smoke';s.style.left=(23*CP)+'px';s.style.top=(-2*CP)+'px';s.style.animationDelay=(-i*1.1)+'s';cab.appendChild(s)}

    bubble.textContent='You have '+left+(left===1?' message! 💌':' messages! 💌');
    mbx.setAttribute('aria-label',bubble.textContent+' Open the mailbox');

    bubble.hidden=true;mbx.setAttribute('aria-label','Open the mailbox');

}
function renderInbox(){
  mlist.innerHTML='';

  const cols=[['#ff8fb1','#ff5d92'],['#b58cff','#8a5ad8'],['#6ec5ff','#3a8fd9']];
  cols.forEach((c,i)=>{
    const ov={p:c[0],y:c[0],P:c[1],w:'#fff6dd'};
    const a=sprite(BF_O,{p:c[0],P:c[1]}),b=sprite(BF_C,{p:c[0]});
    const box=document.createElement('div');box.className='bf';box.style.top=(14+i*22)+'%';box.style.animationDuration=(26+i*9)+'s';box.style.animationDelay=(-i*11)+'s';
    const f1=el(a,4,'f1'),f2=el(b,4,'f2');f2.style.left='4px';f2.style.top='2px';box.append(f1,f2);amb.appendChild(box);
  });
  let hc=0,pc=0;
  setInterval(()=>{
    if(document.hidden||hc>5)return;hc++;
    const h=el(HEART,2+Math.floor(Math.random()*2),'rise');h.style.left=(4+Math.random()*90)+'vw';h.style.top='100vh';h.style.opacity='.55';
    const d=9+Math.random()*5;h.style.animationDuration=d+'s';amb.appendChild(h);setTimeout(()=>{h.remove();hc--},d*1000);
  },2300);
  setInterval(()=>{
    if(document.hidden||pc>12)return;pc++;
    const p=el(PETAL,3,'fall');p.style.left=(Math.random()*100)+'vw';p.style.top='-20px';
    const d=10+Math.random()*7;p.style.animationDuration=d+'s';amb.appendChild(p);setTimeout(()=>{p.remove();pc--},d*1000);
  },1500);
}

/* ---------- music (generated, OFF by default) ---------- */
const musicBtn=$('#music'),sfxBtn=$('#sfx');
let sched=null,step=0,next=0,on=false;
const BPM=70,EIGHTH=60/BPM/2;
const CH=[[48,52,55,60],[45,48,52,57],[41,45,48,53],[43,47,50,55]];
const MEL=[[76,0,79,0,81,79,0,76],[81,0,79,0,76,0,72,0],[74,0,72,0,69,0,72,74],[79,0,76,0,74,0,72,0]];
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(m,t,dur,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+dur+.05);
}
function tick(){
  while(next<ac.currentTime+.4){
    const bar=Math.floor(step/8)%4,s=step%8,ch=CH[bar];
    if(s===0)note(ch[0]-12,next,EIGHTH*7,'sine',.28);
    note(ch[1+(s%3)],next,EIGHTH*1.8,'triangle',.09);
    const m=MEL[bar][s];if(m)note(m,next,EIGHTH*2.6,'sine',.16);
    next+=EIGHTH;step++;
  }
}
function setMusic(v){
  unlock();if(!ac)return;
  on=v;musicBtn.setAttribute('aria-pressed',on);musicBtn.innerHTML='&#9834; Music: '+(on?'ON':'OFF');
  musicBus.gain.cancelScheduledValues(ac.currentTime);
  if(on){
    musicBus.gain.linearRampToValueAtTime(.5,ac.currentTime+1.2);
    step=0;next=ac.currentTime+.1;clearInterval(sched);sched=setInterval(tick,120);tick();
  }else{
    musicBus.gain.linearRampToValueAtTime(0,ac.currentTime+.6);
    setTimeout(()=>{if(!on)clearInterval(sched)},700);
  }
}
musicBtn.addEventListener('click',()=>setMusic(!on));
sfxBtn.addEventListener('click',()=>{
  unlock();sfxOn=!sfxOn;sfxBtn.setAttribute('aria-pressed',sfxOn);sfxBtn.innerHTML='&#9835; Sound: '+(sfxOn?'ON':'OFF');
  if(sfxOn)sClick();
});

/* ---------- start screen (unlocks sound, then the farm begins) ---------- */
$('#startBtn').addEventListener('click',()=>{
  unlock();sClick();setMusic(true);
  document.body.classList.add('go');
  const st=$('#start');st.classList.add('out');setTimeout(()=>st.remove(),650);
  const q=$('#q');const full=q.textContent;
  setTimeout(()=>typeText(q,full),reduce?0:1250);
});
})();
</script>
