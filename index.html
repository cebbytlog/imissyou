<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f86e0">
<title>AJ's Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --vh:1vh;
  --u:clamp(2.4px,calc(var(--vh)*.55),6px);
  --mu:clamp(3px,calc(var(--hor)*.0165),6px);
  --mb:calc(var(--u)*.72);
  --ftop:calc(56px + min(100vw - 20px,520px,var(--vh)*46)*.4436 + var(--vh)*1.5);
  --hor:calc(var(--ftop) + var(--vh)*4);
  --wood:#8a4b1e; --wood-d:#5a2f10; --paper:#fbe7b5; --ink:#4a2a10;
}
@supports (height:1svh){:root{--vh:1svh}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:'VT323','Courier New',monospace;color:var(--ink);background:#4fa3ee;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
img{image-rendering:pixelated}
.spr{display:inline-block;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;flex:none}

/* ===================== the world (sky, mountains, land) ===================== */
.page{position:relative;min-height:calc(var(--vh)*100);overflow:hidden}
.world{position:absolute;inset:0;overflow:hidden}
.sky{position:absolute;left:0;right:0;top:0;height:var(--hor);background:linear-gradient(#2f86e0 0%,#4fa3ee 30%,#78bef6 60%,#a9dcfb 85%,#d4eefd 100%)}
.sun{position:absolute;left:68%;top:calc(var(--hor)*.36);width:calc(var(--hor)*.5);height:calc(var(--hor)*.5);border-radius:50%;background:#fff7c2;box-shadow:0 0 0 calc(var(--hor)*.03) #fff2a088,0 0 0 calc(var(--hor)*.07) #ffffff55,0 0 calc(var(--hor)*.3) calc(var(--hor)*.12) #ffffff55}
.star{display:none;position:absolute;width:3px;height:3px;background:#fff;animation:tw 2.4s steps(1) infinite}
@keyframes tw{50%{opacity:.25}}
.cl{position:absolute;animation:cl 70s linear infinite alternate}
@keyframes cl{from{transform:translateX(-6vw)}to{transform:translateX(10vw)}}
.ml{position:absolute;left:0;right:0;background-repeat:repeat-x;image-rendering:pixelated}
.grass{position:absolute;left:0;right:0;top:var(--hor);bottom:0;image-rendering:pixelated}
.dirt{position:absolute;left:0;right:0;top:calc(var(--vh)*57);bottom:0;image-rendering:pixelated}
.dirt::before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*-5);height:calc(var(--u)*5);background-repeat:repeat-x;background-size:calc(var(--u)*16) 100%;background-image:var(--edge);image-rendering:pixelated}
.decor{position:absolute;inset:0;pointer-events:none}
.decor .spr{position:absolute}

/* ===================== foreground ===================== */
.ui{
  position:relative;z-index:5;min-height:calc(var(--vh)*100);max-width:620px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(var(--vh)*1.5);
  padding:56px 10px 34px;
}
.sign{
  display:block;width:min(calc(100vw - 20px),520px,calc(var(--vh)*46));height:auto;flex:none;
  filter:drop-shadow(0 5px 0 rgba(0,20,60,.3));visibility:hidden;
}
body.go .sign{visibility:visible;animation:signdrop 1.1s steps(9,end) both}
@keyframes signdrop{0%{transform:translateY(-140%)}58%{transform:translateY(7%)}78%{transform:translateY(-3%)}100%{transform:translateY(0)}}

/* the farm: everything is positioned in % of this box so it scales together.
   z-index of every object = its ground line (% from the top), so nearer things draw in front */
.farm{position:relative;flex:none;width:min(100%,860px,calc((var(--vh)*100 - 112px - min(100vw - 20px,520px,var(--vh)*46)*.4436)/1.38));aspect-ratio:1/1.38;container-type:inline-size}
.farm>*{position:absolute}
.tree{display:none;height:auto}
#p1{display:block;left:3%;top:6.68%;width:8%;z-index:20}
#p2{display:block;left:23%;top:6.92%;width:8%;z-index:19}
#p3{display:block;left:43%;top:7.80%;width:8%;z-index:20}
#p4{display:block;left:63%;top:6.68%;width:8%;z-index:19}
#p5{display:block;left:83%;top:6.68%;width:8%;z-index:20}
#p6{display:block;left:13%;top:15.72%;width:11%;z-index:29}
#p7{display:block;left:33%;top:14.14%;width:9%;z-index:28}
#p8{display:block;left:53%;top:15.41%;width:9%;z-index:29}
#p9{display:block;left:73%;top:15.72%;width:11%;z-index:29}
#p10{display:block;left:90.5%;top:16.04%;width:8.5%;z-index:29}
#p11{display:block;left:1%;top:24.41%;width:9%;z-index:38}
#p12{display:block;left:14%;top:26.91%;width:8.5%;z-index:40}
#p13{display:block;left:25%;top:26.28%;width:9%;z-index:40}
#p14{display:block;left:90.5%;top:26.41%;width:9%;z-index:40}
#w1{display:none}
#w2{display:none}
#w3{display:none}
#w4{display:none}
#w5{display:none}
#w6{display:none}
#w7{display:none}
#w8{display:none}
#w9{display:none}
#s1{display:none}
#s2{display:none}
#s3{display:none}
#s4{display:none}
#s5{display:none}
#s6{display:none}
#s7{display:none}
#s8{display:none}
.fence{left:calc(50% - 50vw);width:100vw;top:34%;height:calc(var(--u)*9);z-index:42;background-repeat:repeat-x;background-size:auto 100%;image-rendering:pixelated;pointer-events:none}
@supports (width:1cqw){.fence{height:10.5cqw;background-size:14cqw 100%}}
.hgrp{left:2%;top:30%;width:86%;aspect-ratio:820/568;z-index:73}
.hgrp>img{position:absolute;display:block;height:auto}
.hgrp .house{left:0;top:0;width:100%}
.ch{transform-origin:50% 100%;animation:idle 2.6s steps(1,end) infinite;z-index:2}
#girl{left:66%;top:78.8%;width:6.7%}
#boy{left:73%;top:78.8%;width:6.4%;animation-delay:-1.3s;animation-duration:3s}
#dog{left:59.4%;top:87.3%;width:6.1%;animation-delay:-.7s;animation-duration:3.4s}
#cat{left:79.8%;top:90.2%;width:5.9%;animation-delay:-2s;animation-duration:2.8s}
.pheart{position:absolute;left:81.5%;top:80%;opacity:0;animation:pheart 7s steps(1,end) infinite;z-index:3}
@keyframes pheart{0%,70%{opacity:0;transform:translateY(0)}72%{opacity:1;transform:translateY(0)}82%{opacity:1;transform:translateY(-90%)}92%{opacity:1;transform:translateY(-170%)}96%,100%{opacity:0;transform:translateY(-200%)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
.smoke{position:absolute;left:83.5%;top:2.7%;width:3%;aspect-ratio:1;background:#fff;opacity:0;animation:smoke 3.6s steps(7) infinite;z-index:1}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translate(60%,-900%) scale(1.7);opacity:0}}
.yard{left:0;top:75%;width:100%;height:24.5%;visibility:hidden;pointer-events:none}
.jzone{left:0;top:75%;width:100%;height:24.5%;visibility:hidden;pointer-events:none}
/* junimos */
.jun{left:0;top:0;width:9%;z-index:100;will-change:transform}
.jun img{display:block;width:100%;height:auto;image-rendering:pixelated}
.jun .shadow{left:12%;right:12%;bottom:-3px;height:7px}
.jb{position:relative;transform-origin:50% 100%;animation:jidle 1.8s steps(1,end) infinite}
@keyframes jidle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.95)}}
.jun.walk .jb{animation:jhop .44s steps(1,end) infinite}
@keyframes jhop{0%{transform:translateY(0) scale(1.1,.88)}20%{transform:translateY(-22%) scale(.94,1.08)}45%{transform:translateY(-34%) scale(.94,1.08)}70%{transform:translateY(-14%) scale(1,1)}85%{transform:translateY(0) scale(1.1,.88)}}
.jb.jump{animation:jjump .62s steps(1,end)}
@keyframes jjump{0%{transform:translateY(0) scale(1.12,.86)}15%{transform:translateY(-55%) scale(.92,1.1)}35%{transform:translateY(-75%) scale(.92,1.1) rotate(-12deg)}55%{transform:translateY(-45%) rotate(8deg)}75%{transform:translateY(-8%)}90%{transform:translateY(0) scale(1.12,.86)}}

/* mailbox */
.mbwrap{position:absolute;left:102%;bottom:0;z-index:5;flex:none;--mb:calc(var(--u)*.55)}
@supports (width:1cqw){.mbwrap{--mb:calc(86cqw*.0046)}}
.mailbox{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mb-art{position:relative;display:block}
.mb-art>.spr{position:absolute}
.mb-body{z-index:2;left:0;top:0}
.mb-door{z-index:3;transform-origin:50% 100%;transition:transform .5s steps(5,end)}
.mb-peek{z-index:1;left:0;top:0;transition:transform .9s steps(7,end) .35s}
.mb-flag{z-index:3;transition:transform .45s steps(4,end)}
.mailbox.unread .mb-peek{transform:translateY(calc(var(--mpx) * -4))}
.mailbox.open .mb-door{transform:scaleY(.16)}
.mailbox.open .mb-peek{transform:translateY(calc(var(--mpx) * -9))}
.mailbox.read .mb-flag,.mailbox.open .mb-flag{transform:rotate(-90deg)}
.mailbox:not(.open):hover .mb-art{animation:wiggle .5s steps(1,end) 2}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.mailnote{position:absolute;left:50%;bottom:calc(100% + 3px);margin-left:-14px;width:29px;height:22px;background:none;border:0;padding:0;cursor:pointer;z-index:4;animation:nb 1.1s steps(1,end) infinite}
.mailnote .spr{display:block}
.badge{position:absolute;right:-8px;top:-9px;min-width:15px;height:15px;padding:0 2px;background:#e0443a;border:2px solid #5a2f10;color:#fff;font:700 9px/11px "Courier New",monospace;text-align:center}
@keyframes nb{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* chickens wander in the yard below the house */
.hen{left:0;top:0;width:13%;z-index:100;will-change:transform}
.shadow{position:absolute;left:12%;right:12%;bottom:-4px;height:10px;border-radius:50%;background:rgba(70,40,10,.3)}
.fl{position:relative;transform:scaleX(var(--f,1))}
.bob{position:relative;transform-origin:50% 100%;animation:breathe 2.6s steps(1,end) infinite}
.hen.walk .bob{animation:hop .34s steps(1,end) infinite}
.hen.peck .bob{animation:peck .76s steps(1,end)}
@keyframes peck{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(3%) rotate(16deg)}40%{transform:translateY(0) rotate(2deg)}60%{transform:translateY(3%) rotate(16deg)}80%{transform:translateY(0) rotate(2deg)}}
.hen img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.96)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7%) rotate(-2deg)}}

/* pixel speech bubbles */
.say{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);pointer-events:none;z-index:7;white-space:nowrap}
.say-in{
  position:relative;padding:3px 10px 4px;background:#fff6dd;color:#7a2d45;
  font-family:'VT323','Courier New',monospace;font-size:clamp(18px,5vw,23px);line-height:1.1;
  border:3px solid #5a2f10;box-shadow:inset 0 0 0 2px #f6dca0,0 3px 0 #5a2f10;
  opacity:0;transition:opacity .45s steps(5,end)
}
.say-in::after{content:"";position:absolute;left:50%;bottom:-11px;width:8px;height:8px;margin-left:-5px;background:#fff6dd;border:3px solid #5a2f10;border-top:0;border-left:0;transform:rotate(45deg) translate(-2px,-2px)}
.say.on.hush .say-in{opacity:0}
.say.on .say-in{opacity:1;animation:sfloat 2.4s ease-in-out infinite}
@keyframes sfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* start screen dialogue */
.dlg{
  position:relative;z-index:3;width:100%;max-width:540px;flex:none;
  background:#fbe7b5;border:5px solid #8a4b1e;outline:4px solid #5a2f10;border-radius:6px;
  box-shadow:inset 0 0 0 4px #f3cf86,0 8px 0 #5a2f10;
  padding:calc(var(--vh)*2.2) 18px calc(var(--vh)*2.4);
  font-family:"Courier New",ui-monospace,monospace;font-weight:700;color:#4a2a10;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.tag{position:absolute;top:-24px;left:14px;background:#8a4b1e;color:#ffe9b8;padding:2px 10px;font-size:13px;border:3px solid #5a2f10;line-height:1.4}
.nx{position:absolute;right:10px;bottom:4px;color:#8a4b1e;animation:nx .6s steps(2) infinite;font-size:20px}
@keyframes nx{50%{transform:translateY(3px)}}
.q{margin:0;width:100%;line-height:1.28;display:flex;align-items:center;justify-content:center;text-align:center}
.btns{position:relative;z-index:3;display:flex;gap:18px;align-items:center;justify-content:center;flex:none}
.pb{
  font-family:"Courier New",ui-monospace,monospace;font-weight:700;font-size:clamp(18px,5.4vw,26px);
  padding:calc(var(--vh)*1.3) 22px;border:4px solid #5a2f10;border-radius:4px;cursor:pointer;color:#fff;text-shadow:2px 2px 0 #0003;
  box-shadow:inset 0 -6px 0 #0003,0 6px 0 #5a2f10;transition:transform .1s steps(2);min-width:118px
}
.pb:hover{transform:translateY(-2px)}
.pb:active{transform:translateY(4px);box-shadow:inset 0 -6px 0 #0003,0 2px 0 #5a2f10}
.enterbtn{position:relative;z-index:3;background:none;border:0;padding:0;cursor:pointer;width:min(52vw,230px,calc(var(--vh)*26));-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 6px 0 rgba(0,20,60,.35));transition:transform .1s steps(2)}
.enterbtn img{display:block;width:100%;height:auto;image-rendering:pixelated}
.enterbtn:hover{transform:translateY(-3px)}
.enterbtn:active{transform:translateY(4px)}
.pb:focus-visible,.enterbtn:focus-visible,.mailbox:focus-visible,.music:focus-visible,.svb:focus-visible,.svok:focus-visible,.mail:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px #3d2b8a}


/* password gate */
.pw{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:3;width:100%;max-width:420px}
.pwl{font-family:'Press Start 2P',monospace;font-size:clamp(10px,2.8vw,13px);color:#fff;text-shadow:2px 2px 0 #5a2f10;letter-spacing:.04em;text-align:center}
#pw{width:min(100%,300px);font-family:"Courier New",monospace;font-weight:700;font-size:clamp(26px,8vw,36px);letter-spacing:.35em;text-indent:.35em;text-align:center;padding:10px 12px;background:#fff6dd;color:#4a2a10;border:4px solid #5a2f10;border-radius:4px;box-shadow:inset 0 0 0 3px #f3cf86,0 5px 0 #5a2f10;outline:none}
#pw:focus{box-shadow:inset 0 0 0 3px #f3cf86,0 5px 0 #5a2f10,0 0 0 6px #3d2b8a}
.pwerr{min-height:1.5em;margin:0;font-family:'Press Start 2P',monospace;font-size:clamp(9px,2.6vw,11px);line-height:1.5;color:#fff;text-shadow:2px 2px 0 #8f2a1c;text-align:center}
.shake{animation:shake .45s steps(6,end)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* corner controls */
.ctrl{position:fixed;z-index:40;top:8px;right:8px;display:flex;flex-direction:row;gap:8px}
.music{position:relative;width:40px;height:40px;font-size:20px;line-height:1;display:grid;place-items:center;background:#fbe7b5;border:4px solid #5a2f10;box-shadow:inset 0 0 0 2px #f3cf86,0 3px 0 #5a2f10;cursor:pointer;color:#4a2a10}
.music[aria-pressed="false"]{opacity:.7}
.music[aria-pressed="false"]::after{content:"";position:absolute;left:3px;right:3px;top:50%;border-top:4px solid #d9605a;transform:rotate(-38deg)}

/* start screen */
.start{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:28px;padding:24px;background:url(assets/start-bg.jpg) center bottom/cover no-repeat,linear-gradient(#0b1650 0%,#1f6fd6 55%,#7fd8f0 100%);image-rendering:pixelated;transition:opacity .5s steps(5);overflow:hidden}
.start::before{content:"";position:absolute;left:50%;bottom:calc(var(--vh)*12);width:150px;height:150px;margin-left:-75px;border-radius:50%;background:#fff1a8;box-shadow:0 0 0 12px #ffe08a88,0 0 0 26px #ffc46a55,0 0 70px 36px #ffb36b66}
.start::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--vh)*17);background:#2a5d94;clip-path:polygon(0 55%,10% 55%,10% 35%,22% 35%,22% 15%,36% 15%,36% 40%,48% 40%,48% 22%,62% 22%,62% 5%,76% 5%,76% 30%,90% 30%,90% 48%,100% 48%,100% 100%,0 100%)}
.start::before,.start::after{content:none!important}
.start>*{position:relative;z-index:1}
.start.out{opacity:0;pointer-events:none}
.start .dlg{max-width:420px}
.start .q{font-size:clamp(20px,6vw,28px);text-align:center;text-wrap:balance}

/* ===================== Stardew-style mailbox + letters ===================== */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;background:rgba(8,18,50,.62)}
.sv{
  position:relative;width:min(94vw,540px);max-height:88vh;display:flex;flex-direction:column;
  background:#d9893a;border:6px solid #5a2f10;border-radius:4px;padding:12px;
  box-shadow:inset 0 0 0 4px #f0b968,0 0 0 4px #8a4b1e,0 12px 0 4px rgba(0,0,0,.35);
  animation:unfold .5s steps(5,end) both;
}
@keyframes unfold{from{transform:translateY(40px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.sv-rib{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;
  background:#8a4b1e;border:4px solid #5a2f10;color:#ffe9b8;padding:7px 16px;
  font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.3;box-shadow:inset 0 0 0 2px #b4672a
}
.sv-in{
  flex:1;min-height:0;overflow:auto;margin-top:8px;padding:20px 18px 12px;
  background:#f8dca8;border:4px solid #8a4b1e;box-shadow:inset 0 0 0 3px #ebc88a;
  background-image:radial-gradient(#ecc98e 1px,transparent 1.5px);background-size:9px 9px;
}
.inhint{margin:0 0 16px;text-align:center;font-family:'Courier New',monospace;font-weight:700;font-size:clamp(15px,4.2vw,18px);color:#6b3a1a}
.mail{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:100%;text-align:left;margin:0 0 14px;padding:10px 14px;background:#ffefc6;border:4px solid #5a2f10;box-shadow:inset 0 0 0 3px #f3cf86,0 5px 0 #5a2f10;cursor:pointer;font-family:'Courier New',monospace;font-weight:700;font-size:clamp(16px,4.6vw,20px);color:#4a2a10;line-height:1.25}
.mail:hover{transform:translateY(-2px)}
.mail>.spr:first-child{justify-self:start}
.mail .lbl{grid-column:2;display:flex;align-items:center;justify-content:center;min-width:2.2em;font-family:'Press Start 2P',monospace;font-size:clamp(26px,7vw,34px);line-height:1;color:#9b2f45;text-align:center;padding:6px 0}
.mail.done{background:#f1d79c}
.mail .new{grid-column:3;justify-self:end;background:#d9605a;color:#fff;font-size:11px;padding:4px 7px;border:3px solid #5a2f10;animation:newblink .9s steps(1) infinite}
@keyframes newblink{50%{background:#ff8f6b}}
#ltitle{display:none}
#reader h2{margin:0 0 6px;text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(11px,3.3vw,14px);line-height:1.7;color:#9b2f45}
.hr{height:calc(var(--u)*2.5);margin:0 auto 14px;width:70%;background-repeat:repeat-x;background-position:center;background-size:auto 100%;image-rendering:pixelated}
#lbody p{margin:0 0 .75em;font-family:'VT323','Courier New',monospace;font-size:clamp(22px,6.2vw,29px);line-height:1.18;color:#4a2a10;white-space:pre-line}
#lbody p.sig{color:#9b2f45}
#lbody .b{visibility:hidden}
.skip{margin:6px 0 0;text-align:center;font-family:'Press Start 2P',monospace;font-size:9px;color:#8a4b1e;opacity:.8}
.sv-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px}
.svb{font-family:'Press Start 2P',monospace;font-size:11px;padding:12px 12px;background:#f4b855;color:#4a2a12;border:4px solid #5a2f10;cursor:pointer;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 0 #5a2f10}
.svok{margin-left:auto;width:58px;height:58px;display:grid;place-items:center;background:#4fbf5f;border:4px solid #5a2f10;cursor:pointer;box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2),0 5px 0 #5a2f10;color:#fff;font-size:34px;line-height:1;text-shadow:2px 2px 0 #1f6b2c;font-family:'Press Start 2P',monospace}

/* wooden fence tile */
function fenceTile(){
  const W=16,H=12,g=grid(W,H);
  for(let x=0;x<W;x++){g[2][x]='k';g[3][x]='b';g[4][x]='B';g[5][x]='k';g[7][x]='k';g[8][x]='b';g[9][x]='B';g[10][x]='k'}
  [[2,5],[10,13]].forEach(([a,b])=>{for(let y=0;y<H;y++)for(let x=a;x<=b;x++)g[y][x]=(x===a||x===b)?'k':(x===a+1?'t':'b');for(let x=a;x<=b;x++)g[0][x]='k'});
  return sprite(rows(g));
}
/* terrain tiles */
function grassTile(){
  const R=rng(7),g=grid(16,16).map(r=>r.map(()=>'h'));
  for(let i=0;i<10;i++){const x=Math.floor(R()*14),y=1+Math.floor(R()*14);g[y][x]='g';g[y][x+1]='g';g[y-1][x]='g'}
  for(let i=0;i<9;i++){g[Math.floor(R()*16)][Math.floor(R()*16)]='L'}
  return sprite(rows(g),{h:'#7ac43f',g:'#5fa92f',L:'#9ee05a'});
}
function dirtTile(){
  const R=rng(33),g=grid(16,16).map(r=>r.map(()=>'t'));
  for(let i=0;i<14;i++){g[Math.floor(R()*16)][Math.floor(R()*15)]='o'}
  for(let i=0;i<8;i++){g[Math.floor(R()*16)][Math.floor(R()*16)]='c'}
  for(let i=0;i<3;i++){const x=Math.floor(R()*14),y=Math.floor(R()*15);g[y][x]='s';g[y][x+1]='S'}
  return sprite(rows(g),{t:'#d6a05a',o:'#bf8744',c:'#e6b872',s:'#b9b2a4',S:'#8f897c'});
}
function dirtEdge(){
  const d=[1,2,3,2,1,1,2,4,3,2,1,2,3,2,1,1],g=grid(16,5);
  d.forEach((dep,x)=>{for(let y=5-dep;y<5;y++)g[y][x]='t'});
  return sprite(rows(g),{t:'#d6a05a'});
}
/* green mountains */
function mtnLayer(W,H,peaks,slope,minH,c){
  const g=grid(W,H);
  for(let x=0;x<W;x++){
    let best=minH,side=1;
    peaks.forEach(([px,h])=>{
      let dx=x-px;if(dx>W/2)dx-=W;if(dx<-W/2)dx+=W;
      const v=Math.floor(h-Math.abs(dx)*slope);
      if(v>best){best=v;side=dx}
    });
    const top=H-best;
    for(let y=top;y<H;y++)g[y][x]=side>0?'d':'f';
    if(side<=0)g[top][x]='h';
    if(side<=0&&top+1<H)g[top+1][x]='h';
  }
  return sprite(rows(g),{f:c.f,d:c.d,h:c.h});
}

/* ---------- audio: sound effects + typing blips (context created on first tap) ---------- */
let ac=null,sfxBus=null,musicBus=null,sfxOn=true,noiseBuf=null;
function unlock(){
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();sfxBus=ac.createGain();sfxBus.gain.value=.55;sfxBus.connect(ac.destination);
    musicBus=ac.createGain();musicBus.gain.value=0;musicBus.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.3),ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended')ac.resume();
}
function tone(f,t0,dur,type,vol,f2){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(sfxBus);o.start(t0);o.stop(t0+dur+.03);
}
function noise(t0,dur,vol,freq){
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t0);s.stop(t0+dur);
}
const SFX=fn=>()=>{if(sfxOn&&ac)fn(ac.currentTime)};
const blip=SFX(t=>tone(380+Math.random()*320,t,.06,'square',.05));
const sClick=SFX(t=>{tone(520,t,.06,'square',.06);tone(780,t+.06,.08,'square',.06)});
const sCreak=SFX(t=>{tone(160,t,.4,'sawtooth',.05,300);tone(1175,t+.45,.2,'sine',.1);tone(1568,t+.58,.3,'sine',.1)});
const sRustle=SFX(t=>{noise(t,.18,.18,3000);noise(t+.12,.12,.12,5000)});
const sBad=SFX(t=>{tone(220,t,.12,'square',.07);tone(165,t+.12,.2,'square',.07)});
const sPop=SFX(t=>{tone(880,t,.07,'sine',.05,1320)});

/* letters: reserve the full layout, reveal text as it types */
function typeReserve(p,text,cb,speed){
  clearInterval(p._t);
  const a=document.createElement('span'),b=document.createElement('span');b.className='b';
  p.textContent='';p.append(a,b);
  const ch=Array.from(text);let i=0;
  const set=n=>{a.textContent=ch.slice(0,n).join('');b.textContent=ch.slice(n).join('')};
  if(reduce){set(ch.length);if(cb)cb();return}
  set(0);
  p._t=setInterval(()=>{
    const c=ch[i++];set(i);
    const now=performance.now();
    if(c!==' '&&c!=='\n'&&now-(typeReserve._b||0)>55){typeReserve._b=now;blip()}
    if(!userScrolled&&i%10===0){
      const r=a.getBoundingClientRect(),sr=svin.getBoundingClientRect();
      if(r.bottom>sr.bottom-30)svin.scrollTop+=r.bottom-sr.bottom+60;
    }
    if(i>=ch.length){clearInterval(p._t);if(cb)cb()}
  },speed||18);
}

/* ---------- junimos + chickens: roam the whole ground, scatter everywhere ---------- */
const jzone=$('#jzone'),farm=$('#farm'),yard=$('#yard');
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const JCOL=[['orange','amping permi'],['yellow','eat well'],['purple','drink water!'],['green','guitarist'],['pink',''],['blue',"i'm sorry..."]];
const juns=JCOL.map(([c,t],i)=>{const node=$('#jun'+i);node.querySelector('.say-in').textContent=t;
  return {node,jb:node.querySelector('.jb'),say:node.querySelector('.say'),x:0,y:0,tx:0,ty:0,state:'idle',wait:.2+i*.35,v:0,top:0,jmp:2+i*.8}});
const henB=$('#henB'),henC=$('#henC'),sayB=$('#sayB'),sayC=$('#sayC');
const HEN_IMG_FACES_RIGHT=true; /* the chicken art faces right; set to false if yours faces left */
const hens=[henB,henC].map((node,i)=>({node,fl:node.querySelector('.fl'),say:i?sayC:sayB,x:0,y:0,tx:0,ty:0,maxY:0,state:'idle',wait:.3+i*.9,dir:i?-1:1,v:0,top:0,peck:1+i}));
sayB.firstElementChild.textContent='i miss youuu';sayC.firstElementChild.textContent='i love youuu';
let JW=0,JH=0,HW=0,Q=2,jx0=0,jx1=0,jy0=0,jy1=0,hx0=0,hx1=0,hy0=0;
function bounds(){
  const r=farm.getBoundingClientRect(),vw=document.documentElement.clientWidth;
  Q=Math.max(2,Math.round(farm.clientWidth/300));
  JW=juns[0].node.offsetWidth||20;JH=juns[0].node.offsetHeight||JW;HW=henB.offsetWidth||farm.clientWidth*.12;
  const t=yard.offsetTop,h=yard.offsetHeight,m=4;
  jx0=-r.left+m;jx1=Math.max(jx0,vw-r.left-JW-m);jy0=t;jy1=Math.max(t,t+h-JH);
  const side=Math.round(Math.max(sayB.offsetWidth,sayC.offsetWidth,HW*2)/2-HW/2)+2;
  hx0=Math.min(-r.left+side,vw/2-r.left-HW);hx1=Math.max(hx0,vw-r.left-HW-side);hy0=t;
  hens.forEach(hn=>{hn.maxY=Math.max(hy0,t+h-(hn.node.offsetHeight||HW))});
}
function placeJ(j){
  const px=Math.round(j.x/Q)*Q,py=Math.round(j.y/Q)*Q;
  j.node.style.transform=`translate(${px}px,${py}px)`;j.node.style.zIndex=100+Math.floor(py/4);
}
function place(h){
  const px=Math.round(h.x/Q)*Q,py=Math.round(h.y/Q)*Q;
  h.node.style.transform=`translate(${px}px,${py}px)`;h.node.style.zIndex=100+Math.floor(py/4);
  h.fl.style.setProperty('--f',(h.dir>0)===HEN_IMG_FACES_RIGHT?1:-1);
}
function stepJ(dt){
  juns.forEach(j=>{
    if(j.state==='idle'){
      j.wait-=dt;j.jmp-=dt;
      if(j.jmp<=0){j.jmp=rnd(2.2,5);j.jb.classList.add('jump');setTimeout(()=>j.jb.classList.remove('jump'),640)}
      if(j.wait<=0){
        if(Math.random()<.75){j.tx=rnd(jx0,jx1);j.ty=rnd(jy0,jy1)}
        else{j.tx=clamp(j.x+rnd(-1,1)*JW*4,jx0,jx1);j.ty=clamp(j.y+rnd(-1,1)*JH*2,jy0,jy1)}
        j.state='walk';j.top=JW*rnd(2.4,3.8);j.node.classList.add('walk');j.jb.classList.remove('jump');
      }
    }else{
      const dx=j.tx-j.x,dy=j.ty-j.y,d=Math.hypot(dx,dy);
      if(d<2){j.state='idle';j.wait=rnd(.2,1.4);j.node.classList.remove('walk');j.v=0}
      else{j.v+=(j.top-j.v)*Math.min(1,dt*6);const st=Math.min(d,j.v*dt);j.x+=dx/d*st;j.y+=dy/d*st}
    }
    j.x=clamp(j.x,jx0,jx1);j.y=clamp(j.y,jy0,jy1);
  });
}
function stepH(dt){
  hens.forEach(h=>{
    if(h.state==='idle'){
      h.wait-=dt;h.v=0;h.peck-=dt;
      if(h.peck<=0&&h.wait>.7){h.peck=rnd(1.8,4);h.node.classList.add('peck');setTimeout(()=>h.node.classList.remove('peck'),780)}
      if(h.wait<=0){
        const hh=h.node.offsetHeight||HW;
        if(Math.random()<.7){h.tx=rnd(hx0,hx1);h.ty=rnd(hy0,h.maxY)}
        else{h.tx=clamp(h.x+rnd(-2.5,2.5)*HW,hx0,hx1);h.ty=clamp(h.y+rnd(-1,1)*hh,hy0,h.maxY)}
        h.state='walk';h.top=HW*rnd(.7,1.1);h.node.classList.add('walk');h.node.classList.remove('peck');
      }
    }else{
      const dx=h.tx-h.x,dy=h.ty-h.y,d=Math.hypot(dx,dy);
      if(d<2){h.state='idle';h.wait=rnd(.6,2.4);h.node.classList.remove('walk')}
      else{
        h.v+=(h.top-h.v)*Math.min(1,dt*5);
        const st=Math.min(d,h.v*dt);h.x+=dx/d*st;h.y+=dy/d*st;
        if(Math.abs(dx)>1.5)h.dir=dx>0?1:-1;   /* face where you are going */
      }
    }
    h.x=clamp(h.x,hx0,hx1);h.y=clamp(h.y,hy0,h.maxY);
  });
}
function sepAll(){   /* nobody stands on top of anybody else; junimos give way more than hens */
  const all=[...hens.map(o=>({o,w:HW,h:o.node.offsetHeight||HW,m:.3,x0:hx0,x1:hx1,y0:hy0,y1:o.maxY})),...juns.map(o=>({o,w:JW,h:JH,m:1,x0:jx0,x1:jx1,y0:jy0,y1:jy1}))];
  for(let a=0;a<all.length;a++)for(let b=a+1;b<all.length;b++){
    const A=all[a],B=all[b];
    const cx=(A.o.x+A.w/2)-(B.o.x+B.w/2),cy=(A.o.y+A.h/2)-(B.o.y+B.h/2);
    const ox=(A.w+B.w)/2*.9-Math.abs(cx),oy=(A.h+B.h)/2*.55-Math.abs(cy);
    if(ox>0&&oy>0){
      const ka=A.m/(A.m+B.m),kb=1-ka;
      if(ox<oy*1.4){const s=cx<0?-1:1;A.o.x+=s*ox*ka;B.o.x-=s*ox*kb}
      else{const s=cy<0?-1:1;A.o.y+=s*oy*ka;B.o.y-=s*oy*kb}
    }
  }
  all.forEach(c=>{c.o.x=clamp(c.o.x,c.x0,c.x1);c.o.y=clamp(c.o.y,c.y0,c.y1)});
}
function fitSay(say){   /* keep a bubble inside the screen */
  say.style.marginLeft='0px';
  const r=say.getBoundingClientRect(),vw=document.documentElement.clientWidth;
  let sh=0;if(r.left<4)sh=4-r.left;else if(r.right>vw-4)sh=vw-4-r.right;
  say.style.marginLeft=sh+'px';
}
/* the pink junimo: one word every 5 minutes: can / we / try / again? */
const PINKW=['can','we','try','again?'];let pk=0;
function pinkSay(){
  const j=juns[4];
  j.say.firstElementChild.textContent=PINKW[pk];pk=(pk+1)%PINKW.length;
  j.say.classList.add('on');fitSay(j.say);
  setTimeout(()=>j.say.classList.remove('on'),10000);
}
const ROT=[0,1,2,3,5];   /* every junimo except the pink one, which has its own 5-minute schedule */
let jsay=0,slot=0;
function nextSlot(){   /* hens, junimo, junimo, hens ... one message at a time */
  ROT.forEach(k=>juns[k].say.classList.remove('on'));
  if(slot++%3===0)cycleSay();
  else{hens.forEach(h=>h.say.classList.remove('on'));setTimeout(junSay,reduce?0:550)}
}
function junSay(){
  const j=juns[ROT[jsay++%ROT.length]];
  j.say.classList.add('on');fitSay(j.say);
}
let last=0,running=false;
function frame(ts){
  if(!running)return;
  requestAnimationFrame(frame);
  const now=ts/1000,dt=Math.min(.05,last?now-last:.016);last=now;
  if(document.hidden)return;
  stepJ(dt);stepH(dt);sepAll();
  juns.forEach(placeJ);hens.forEach(place);
  hens[1].say.classList.toggle('hush',Math.abs(hens[0].x-hens[1].x)<Math.max(sayB.offsetWidth,sayC.offsetWidth,HW*2)*.9);
  juns.forEach(j=>{if(j.say.classList.contains('on'))fitSay(j.say)});
  hens.forEach(h=>{if(h.say.classList.contains('on'))fitSay(h.say)});
}
function spawn(){   /* start already spread out over the whole ground */
  bounds();
  hens.forEach(h=>{h.x=rnd(hx0,hx1);h.y=rnd(hy0,h.maxY);h.dir=Math.random()<.5?1:-1;place(h)});
  juns.forEach(j=>{j.x=rnd(jx0,jx1);j.y=rnd(jy0,jy1);placeJ(j)});
  sepAll();juns.forEach(placeJ);hens.forEach(place);
}
function refit(){bounds();hens.forEach(h=>{h.x=clamp(h.x,hx0,hx1);h.y=clamp(h.y,hy0,h.maxY);place(h)});juns.forEach(j=>{j.x=clamp(j.x,jx0,jx1);j.y=clamp(j.y,jy0,jy1);placeJ(j)})}
function startHens(){
  spawn();
  if(reduce||running)return;
  running=true;requestAnimationFrame(frame);
}
addEventListener('resize',refit);addEventListener('load',refit);
if(window.ResizeObserver){const ro=new ResizeObserver(refit);ro.observe(farm);ro.observe(henB);ro.observe(henC)}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);

/* little floating messages: "I miss you." / "I love you." */
const LINES=['i miss youuu','i love youuu'];
let turn=0;
function showSay(h,text){h.say.firstElementChild.textContent=text;h.say.classList.add('on');fitSay(h.say)}
function cycleSay(){
  hens.forEach(h=>h.say.classList.remove('on'));
  setTimeout(()=>{
    const a=turn%2;
    if(turn%3===2){const only=Math.random()<.5?0:1;showSay(hens[only],LINES[a])}   /* sometimes only one chicken speaks */
    else{showSay(hens[0],LINES[a]);showSay(hens[1],LINES[1-a])}
    sPop();turn++;
  },reduce?0:600);
}

/* ---------- mailbox: 3 personal letters, each clicked open ---------- */
const LETTERS=[
{title:"First Mail 💌",text:"i don't know if you'll ever get to read or see this, but i really hope you do. and if you do, thank you for giving me your time to read all of this. thank you rin sa kapatid mo. don't worry, hindi ko na rin siya guguluhin.\n\ncan you finish reading everything first, by? i still have two more messages pa.\n\ni guess this is my final act of love. i have another code pa, pero hanggang unfinished business na lang muna siya. maybe someday ko na lang tapusin. i don't know when, but for now, i'll just leave it as it is.\n\nand this is probably my last chance na rin in case mabasa mo pa 'to. so anyway, i just have a few more things i want to say. i don't want to keep bothering you, but i also don't want to leave without saying everything i've been keeping to myself. feel ko sasabog na rin kasi ako if i keep all of these to myself.\n\ndon't worry, i'm not writing this to change your mind or make you reconsider anything. i know things are the way they are now, and i respect that. i just want to say these things, not because i'm expecting anything in return, but because there are still words i want you to hear from me, even if you don't believe them anymore.\n\ni hope you can read these messages hanggang dulo. that's all i'm asking. thank you, baby."},
{title:"2nd Mail 💌",text:"from the bottom of my heart, i just want to say i'm sorry. it's all my fault, by. always has been. sinira ko lang talaga lahat ng kung anong meron tayo. i'm sorry for all the fears, for the promises i made but couldn't keep, and for letting my situation at home affect us the way it did. i'm sorry for always worrying about the future and letting my anxiety get in the way.\n\nbut by, i still wanted it. i still wanted us. i wanted to make things work despite everything that was happening around me. i really thought magpahinga muna rin tayo, but i guess hindi mo na rin talaga kaya. and i cant blame you for that.\n\ni blame myself, by, for letting my fears ruin something so beautiful. i wish i had handled things better. i wish i had reassured you more pa, understood you better, and kept the promises i made.\n\ni know you hate me now, and you can't forgive me anymore. ang sakit lang, but i understand. i'm not going to tell you how you should feel after everything that happened. you have every reason to be hurt, and i'm sorry ako yung reason kung bakit ka nasasaktan ngayon.\n\ni'm sorry, by. i really am. i know i ruined something that meant so much to me, and that's something i'll have to live with for the rest of my life."},
{title:"3rd Mail 💌",text:"alam mo, may napanood akong movie dati. i think comet ata yun. sabi nung guy doon, “i feel like i'm in the wrong world. 'cause i don't belong in a world where we don't end up together. i don't. there are parallel universes out there where this didn't happen. where i was with you, and you were with me. and whatever universe that is, that's the one where my heart lives in.” and i felt that.\n\nsana nga may ibang universe aside from this one. i'd like to believe na somewhere out there, there's a version of us na naging okay ang lahat. na we got our timing right, na hindi natin kinailangang mawala sa isa't isa, and that we got to experience the kind of love we both deserved. i'd like to think na happy tayo doon, na we're still choosing each other, and that things worked out differently for us.\n\nmaybe in this universe, things just weren't meant to be. and as much as it hurts, i think it's time for me to accept that. i wish things had turned out differently, by. i wish i could've given you more reasons to stay, and i wish i had done some things differently when i still had the chance.\n\ni love you, by. i really do.\n\nthank you for giving me your time. thank you for listening to me, for being patient with me, and for making time for us despite everything. thank you for making me happy in ways you probably didn't even realize. thank you for the random conversations, the laughter, the chikas and mga rant natin, and all those ordinary moments that somehow became special because they were with you. i'll miss those things more than i can explain.\n\nthank you for letting me get to know you, and for allowing me to be part of your life, even just for a while. i'm grateful i got to experience what it felt like to have you around.\n\nplease take care of yourself, baby. eat on time, please. get enough rest din, and don't be too hard on yourself. i hope you'll find yourself again. i hope you find happiness and peace. you deserve that, and i genuinely hope life becomes kinder to you.\n\ni don't know if we'll ever get to talk again, or if this will really be the last time you'll hear from me. but if it is, i just want my last words to you to be thank you, not goodbye.\n\ni love you, mylove. thank you for everything. i'll always wish you well, wherever life takes you. and if there's really a parallel universe out there, i hope we find each other in that one. i hope that's the universe where we get to stay, where things finally work out, and where we don't have to say goodbye."}
];
const mbx=$('#mailbox'),bubble=$('#bubble'),badge=$('#badge'),modal=$('#modal'),closeBtn=$('#close');
const lTitle=$('#ltitle'),lBody=$('#lbody'),letterBox=$('#letter'),svin=$('#svin'),inbox=$('#inbox'),reader=$('#reader'),mlist=$('#mlist'),inhint=$('#inhint'),backBtn=$('#back'),rib=$('#rib'),skipEl=$('#skip');
const read=new Set();let typing=0,userScrolled=false;
['wheel','touchstart','keydown'].forEach(ev=>svin.addEventListener(ev,()=>{userScrolled=true},{passive:true}));

(function(){
  /* residential post-mounted mailbox: arched box, hinged front door, wooden post, little flag */
  const BODY=sprite([
    '.....'+'k'.repeat(10)+'.....',
    '...kk'+'l'.repeat(10)+'kk...',
    '..k'+'l'.repeat(14)+'k..',
    ...Array(6).fill('.k'+'r'.repeat(13)+'BBB'+'k.'),
    '.k'+'R'.repeat(16)+'k.',
    '.'+'k'.repeat(18)+'.',
    ...Array.from({length:11},(_,i)=>i%2?'........ktbk........':'........kbBk........'),
    '......kbbbbbbk......',
    '......'+'k'.repeat(8)+'......']);
  const DOOR=sprite(['kllrk','krrrk','krrrk','kryrk','krrrk','krrRk','kkkkk']);
  const PEEK=sprite(['kkkkkkkk','kwwwwwwk','kwtttwwk','kwwwwwwk','kwttwwwk','kwwpwwwk','kkkkkkkk']);
  const FLAG=sprite(['.....yy','....yyy','.....yy','.....k.','.....k.','.....k.','.....k.']);
  bubble.insertBefore(el(ENV,2.4),bubble.firstChild);
  const M=n=>`calc(var(--mb)*${n})`;
  const art=document.createElement('span');art.className='mb-art';art.style.width=M(BODY.w);art.style.height=M(BODY.h);
  mbx.style.setProperty('--mpx','var(--mb)');
  const peek=el(PEEK,'var(--mb)','mb-peek');peek.style.left=M(6);peek.style.top=M(1);
  const body=el(BODY,'var(--mb)','mb-body');
  const door=el(DOOR,'var(--mb)','mb-door');door.style.left=M(14);door.style.top=M(3);
  const flag=el(FLAG,'var(--mb)','mb-flag');flag.style.left=M(-1.5);flag.style.top=M(-1);flag.style.transformOrigin=M(5.5)+' '+M(6.5);
  art.append(peek,body,door,flag);mbx.appendChild(art);
  const hs=sprite(['.p.p.','ppppp','.ppp.','..p..']);
  $('#hr').style.backgroundImage=hs.url;$('#hr').style.backgroundSize='auto 100%';
  $('#hr').style.width='60%';
})();

$('#pheart').appendChild(el(HEART,3));
function updateBubble(){
  const left=LETTERS.length-read.size;
  if(left>0){
    bubble.hidden=false;badge.textContent=left;mbx.classList.add('unread');
    mbx.setAttribute('aria-label','You have '+left+(left===1?' new message':' new messages')+'. Open the mailbox');
  }else{
    bubble.hidden=true;mbx.classList.remove('unread');mbx.setAttribute('aria-label','Open the mailbox');
  }
}
const LETTERS_READY=false;   /* flip to true when the letters are finished */
const note=$('#note'),noteOk=$('#noteOk');
function showNote(){note.hidden=false;noteOk.focus({preventScroll:true})}
function hideNote(){note.hidden=true;sClick();const f=mlist.querySelector('.mail');if(f)f.focus({preventScroll:true})}
noteOk.addEventListener('click',hideNote);
note.addEventListener('click',e=>{if(e.target===note)hideNote()});
function renderInbox(){
  mlist.innerHTML='';
  LETTERS.forEach((L,i)=>{
    const done=read.has(i),b=document.createElement('button');
    b.type='button';b.className='mail'+(done?' done':'');
    b.appendChild(el(done?ENVO:ENV,4));
    const t=document.createElement('span');t.className='lbl';
    if(i===1)t.appendChild(el(LHEART,4));else t.textContent=['I','','ü'][i];
    b.appendChild(t);b.setAttribute('aria-label','Mail '+(i+1)+(done?' (read)':' (new)'));
    if(!done){const n=document.createElement('span');n.className='new';n.textContent='NEW!';b.appendChild(n)}
    b.addEventListener('click',()=>{sClick();if(LETTERS_READY)openLetter(i);else showNote()});
    mlist.appendChild(b);
  });
  inhint.textContent=read.size<LETTERS.length?'Tap each mail to open it 💌':'You read all your messages 💚';
}
function showInbox(){
  typing++;
  reader.hidden=true;inbox.hidden=false;backBtn.hidden=true;rib.textContent='MAILBOX';renderInbox();svin.scrollTop=0;
  (mlist.querySelector('.mail:not(.done)')||mlist.querySelector('.mail')||closeBtn).focus({preventScroll:true});
}
function openLetter(i){
  read.add(i);const id=++typing;
  const L=LETTERS[i];lBody.innerHTML='';
  const texts=L.text.split('\n\n'),ps=texts.map((t,k)=>{const p=document.createElement('p');if(k===texts.length-1)p.className='sig';lBody.appendChild(p);return p});
  inbox.hidden=true;reader.hidden=false;backBtn.hidden=false;rib.textContent='LETTER '+(i+1)+' / '+LETTERS.length;
  svin.scrollTop=0;letterBox.style.animation='none';void letterBox.offsetWidth;letterBox.style.animation='';
  skipEl.hidden=false;userScrolled=false;
  const sp=L.text.length>1800?6:L.text.length>1000?10:16;
  const finish=()=>{typing++;ps.forEach((p,k)=>{clearInterval(p._t);p.textContent=texts[k]});skipEl.hidden=true};
  lBody.onclick=finish;
  let k=0;
  (function nxt(){
    if(id!==typing)return;
    if(k>=ps.length){skipEl.hidden=true;return}
    const idx=k++;typeReserve(ps[idx],texts[idx],()=>setTimeout(nxt,140),sp);
  })();
  sRustle();updateBubble();backBtn.focus({preventScroll:true});
}
updateBubble();
let lastFocus=null,busy=false;
function openMail(){
  if(busy||!modal.hidden)return;busy=true;lastFocus=document.activeElement;
  sClick();sCreak();mbx.classList.add('open');bubble.hidden=true;
  setTimeout(()=>{
    modal.hidden=false;document.body.style.overflow='hidden';showInbox();sRustle();busy=false;
  },reduce?0:1200);
}
function closeMail(){
  typing++;sClick();modal.hidden=true;document.body.style.overflow='';
  setTimeout(()=>{mbx.classList.remove('open');if(read.size===LETTERS.length)mbx.classList.add('read')},250);
  updateBubble();
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
mbx.addEventListener('click',openMail);
bubble.addEventListener('click',openMail);
closeBtn.addEventListener('click',closeMail);
backBtn.addEventListener('click',()=>{sClick();showInbox()});
modal.addEventListener('click',e=>{if(e.target===modal)closeMail()});
document.addEventListener('keydown',e=>{
  if(modal.hidden)return;
  if(!note.hidden){if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();hideNote()}else if(e.key==='Tab')e.preventDefault();return}
  if(e.key==='Escape')closeMail();
  if(e.key==='Tab'){
    e.preventDefault();
    const f=[...letterBox.querySelectorAll('button')].filter(b=>!b.hidden&&!b.disabled&&b.offsetParent!==null),k=f.indexOf(document.activeElement);
    f[(k+(e.shiftKey?-1:1)+f.length)%f.length].focus();
  }
});

/* ---------- ambient: hearts, petals, butterflies ---------- */
const amb=$('#amb');
if(!reduce){
  const cols=[['#ff8fb1','#ff5d92'],['#b58cff','#8a5ad8'],['#ffe066','#e0a820']];
  cols.forEach((c,i)=>{
    const a=sprite(BF_O,{p:c[0],P:c[1]}),b=sprite(BF_C,{p:c[0]});
    const box=document.createElement('div');box.className='bf';box.style.top=(46+i*14)+'%';box.style.animationDuration=(26+i*9)+'s';box.style.animationDelay=(-i*11)+'s';
    const f1=el(a,4,'f1'),f2=el(b,4,'f2');f2.style.left='4px';f2.style.top='2px';box.append(f1,f2);amb.appendChild(box);
  });
  let hc=0,pc=0;
  setInterval(()=>{
    if(document.hidden||hc>5)return;hc++;
    const h=el(HEART,2+Math.floor(Math.random()*2),'rise');h.style.left=(4+Math.random()*90)+'vw';h.style.top='100vh';h.style.opacity='.55';
    const d=9+Math.random()*5;h.style.animationDuration=d+'s';amb.appendChild(h);setTimeout(()=>{h.remove();hc--},d*1000);
  },2300);
  setInterval(()=>{
    if(document.hidden||pc>12)return;pc++;
    const p=el(PETAL,3,'fall');p.style.left=(Math.random()*100)+'vw';p.style.top='-20px';
    const d=10+Math.random()*7;p.style.animationDuration=d+'s';amb.appendChild(p);setTimeout(()=>{p.remove();pc--},d*1000);
  },1500);
}

/* ---------- music: your music.mp3 ---------- */
const musicBtn=$('#music'),sfxBtn=$('#sfx');
let on=false;
const bgm=new Audio('assets/music.mp3');bgm.loop=true;bgm.volume=.5;bgm.preload='auto';
function setMusic(v){
  on=v;musicBtn.setAttribute('aria-pressed',on);
  if(on){const pr=bgm.play();if(pr&&pr.catch)pr.catch(()=>{})}else bgm.pause();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else if(on){const pr=bgm.play();if(pr&&pr.catch)pr.catch(()=>{})}});
musicBtn.addEventListener('click',()=>setMusic(!on));
sfxBtn.addEventListener('click',()=>{
  unlock();sfxOn=!sfxOn;sfxBtn.setAttribute('aria-pressed',sfxOn);sfxBtn.textContent=sfxOn?'🔊':'🔇';
  if(sfxOn)sClick();
});

/* ---------- start screen (unlocks sound, then the farm begins) ---------- */
const pw=$('#pw'),pwErr=$('#pwErr'),PASS='080808';
function enter(){
  try{unlock()}catch(e){}
  if(pw.value.trim()!==PASS){
    pwErr.textContent='ennggkkk! wrong ka po babi';try{sBad()}catch(e){}
    pw.value='';const box=$('#pwBox');box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');pw.focus();
    return;
  }
  document.body.classList.add('go');
  const st=$('#start');st.classList.add('out');setTimeout(()=>{try{st.remove()}catch(e){}},650);
  document.body.style.overflow='';
  try{sClick()}catch(e){}
  try{setMusic(true)}catch(e){}
  try{startHens()}catch(e){console.error(e)}
  setTimeout(()=>{try{nextSlot();setInterval(nextSlot,3700)}catch(e){console.error(e)}},reduce?0:900);
  setTimeout(()=>{try{pinkSay();setInterval(pinkSay,300000)}catch(e){console.error(e)}},reduce?0:3200);
}
pw.addEventListener('input',()=>{pw.value=pw.value.replace(/\D/g,'');pwErr.textContent=''});
pw.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();enter()}});
$('#startBtn').addEventListener('click',enter);
})();
</script>
</body>
</html>
