<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4a9e">
<title>A Little Farm for Jeam Abby Keith Panganiban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --vh:1vh;
  --u:clamp(2.4px,calc(var(--vh)*.55),6px);      /* base pixel size for sprites */
  --mu:clamp(3px,calc(var(--vh)*.78),10px);        /* mountain pixel size */
  --mb:calc(var(--u)*.72);                       /* small mailbox */
  --hor:calc(var(--vh)*38);                      /* horizon line */
  --hw:clamp(110px,min(41vw,calc(var(--vh)*30)),260px);
  --gap:clamp(14px,6vw,70px);
  --wood:#8a4b1e; --wood-d:#5a2f10; --paper:#fbe7b5; --ink:#4a2a10;
}
@supports (height:1svh){:root{--vh:1svh}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{
  font-family:'VT323','Courier New',monospace;color:var(--ink);background:#2f6fd0;
  -webkit-text-size-adjust:100%;touch-action:manipulation;
}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.spr{display:inline-block;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;flex:none}

/* ===================== the world (sky, mountains, land) ===================== */
.page{position:relative;min-height:calc(var(--vh)*100);overflow:hidden}
.world{position:absolute;inset:0;overflow:hidden}
.sky{position:absolute;left:0;right:0;top:0;height:var(--hor);background:linear-gradient(#10277a 0%,#1b47ad 22%,#2f6fd0 45%,#5aa6ef 66%,#a9d9ff 85%,#d6efff 100%)}
.star{position:absolute;width:3px;height:3px;background:#fff;animation:tw 2.4s steps(1) infinite}
@keyframes tw{50%{opacity:.25}}
.cl{position:absolute;animation:cl 70s linear infinite alternate}
@keyframes cl{from{transform:translateX(-6vw)}to{transform:translateX(10vw)}}
.ml{position:absolute;left:0;right:0;background-repeat:repeat-x;image-rendering:pixelated}
.grass{position:absolute;left:0;right:0;top:var(--hor);bottom:0;image-rendering:pixelated}
.dirt{position:absolute;left:0;right:0;top:calc(var(--vh)*57);bottom:0;image-rendering:pixelated}
.dirt::before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*-5);height:calc(var(--u)*5);background-repeat:repeat-x;background-size:calc(var(--u)*16) 100%;background-image:var(--edge);image-rendering:pixelated}
.decor{position:absolute;inset:0;pointer-events:none}
.decor .spr{position:absolute}

/* ===================== foreground UI (one screen, no scrolling) ===================== */
.ui{
  position:relative;z-index:5;min-height:calc(var(--vh)*100);max-width:620px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(var(--vh)*2);
  padding:64px 10px 44px;
}
.sign{
  display:block;width:min(calc(100vw - 20px),580px);height:auto;flex:none;
  filter:drop-shadow(0 5px 0 rgba(0,20,60,.3));visibility:hidden;
}
body.go .sign{visibility:visible;animation:signdrop 1.1s steps(9,end) both}
@keyframes signdrop{0%{transform:translateY(-140%)}58%{transform:translateY(7%)}78%{transform:translateY(-3%)}100%{transform:translateY(0)}}

/* cabin + small mailbox */
.scene{position:relative;align-self:flex-end;display:flex;align-items:flex-end;gap:calc(var(--u)*3);padding-top:calc(var(--vh)*5);margin-right:1vw;flex:none}
.cabin{position:relative;flex:none}
.cabin .spr{display:block}
.smoke{position:absolute;width:calc(var(--u)*2);height:calc(var(--u)*2);background:#fff;opacity:0;animation:smoke 3.4s steps(7) infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translate(12px,-52px) scale(1.7);opacity:0}}
.mbwrap{position:relative;flex:none}
.mailbox{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mb-art{position:relative;display:block}
.mb-art>.spr{position:absolute}
.mb-body{z-index:2;left:0;top:0}
.mb-door{z-index:3;transform-origin:50% 100%;transition:transform .5s steps(5,end)}
.mb-peek{z-index:1;left:0;top:0;transition:transform .9s steps(7,end) .35s}
.mb-flag{z-index:3;transition:transform .45s steps(4,end)}
.mailbox.unread .mb-peek{transform:translateY(calc(var(--mpx) * -4))}
.mailbox.open .mb-door{transform:scaleY(.16)}
.mailbox.open .mb-peek{transform:translateY(calc(var(--mpx) * -9))}
.mailbox.read .mb-flag,.mailbox.open .mb-flag{transform:rotate(-90deg)}
.mailbox:not(.open):hover .mb-art{animation:wiggle .5s steps(1,end) 2}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.mailnote{position:absolute;left:50%;bottom:calc(100% + 4px);margin-left:-24px;width:48px;height:36px;background:none;border:0;padding:0;cursor:pointer;z-index:4;animation:nb 1.1s steps(1,end) infinite}
.mailnote .spr{display:block}
.badge{position:absolute;right:-12px;top:-13px;min-width:24px;height:24px;padding:0 5px;background:#e0443a;border:3px solid #5a2f10;color:#fff;font:700 15px/18px "Courier New",monospace;text-align:center}
@keyframes nb{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}}

/* chickens (still sprites: they only walk + kiss) */
.stage{position:relative;width:100%;flex:none;margin-top:calc(var(--vh)*1.5)}
.pair{display:flex;justify-content:center;align-items:flex-end;gap:var(--gap);position:relative}
.hen{position:relative;width:var(--hw);flex:none;transition:transform 1.4s steps(8,end)}
.shadow{position:absolute;left:12%;right:12%;bottom:-5px;height:12px;border-radius:50%;background:rgba(70,40,10,.3);z-index:0}
.bob{position:relative;z-index:1;transform-origin:50% 100%}
.hen img{display:block;width:100%;height:auto;image-rendering:pixelated;user-select:none;-webkit-user-drag:none}
.love .brown{transform:translateX(calc(var(--gap)/2 - var(--hw)*.03))}
.love .cream{transform:translateX(calc((var(--gap)/2 - var(--hw)*.03) * -1))}
.sad .brown .bob{transform:rotate(13deg) translateY(7%) scaleY(.93)}
.sad .cream .bob{transform:rotate(-9deg)}
.mood{position:absolute;display:none;pointer-events:none}
.sad .mood{display:block}
.raincloud{left:50%;top:-52%;transform:translateX(-30%);width:calc(var(--hw)*.8)}
.rain{position:absolute;top:70%;width:4px;height:12px;background:#6ec5ff;box-shadow:0 0 0 2px rgba(255,255,255,.5) inset;animation:rain .9s linear infinite}
@keyframes rain{from{transform:translateY(0);opacity:1}to{transform:translateY(calc(var(--hw)*.75));opacity:.2}}
.tear{left:67%;top:30%;animation:tear 1.2s steps(6,end) infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(calc(var(--hw)*.35));opacity:0}}
.qmark{font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.6vw,20px);color:#fff;background:#7a5ad8;border:3px solid #3d2b8a;padding:6px 8px;left:12%;top:-34%}
.qmark.b{left:48%;top:-52%;background:#e0577f;border-color:#8f2a46}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.fx .spr{position:absolute}
.fh{animation:floatup 2.4s ease-out forwards}
@keyframes floatup{
  0%{transform:translate(-50%,0) scale(.4);opacity:0}
  15%{opacity:1;transform:translate(-50%,-10px) scale(1)}
  55%{transform:translate(calc(-50% + 12px),-52px) scale(1)}
  100%{transform:translate(calc(-50% - 8px),-110px) scale(.9);opacity:0}
}
.fs{animation:twinkle 1.1s steps(5,end) forwards}
@keyframes twinkle{0%{transform:translate(-50%,-50%) scale(0);opacity:0}40%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-60%) scale(0);opacity:0}}
.fpulse{transform:translateX(-50%);animation:pulse .8s steps(2,end) infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.25)}}
.mwah{font-family:'Press Start 2P',monospace;font-size:clamp(10px,3vw,14px);color:#fff;text-shadow:2px 2px 0 #c2447a,-2px -2px 0 #c2447a,2px -2px 0 #c2447a,-2px 2px 0 #c2447a;animation:floatup 1.9s ease-out forwards;white-space:nowrap;position:absolute}

/* dialogue box (big text) + buttons */
.dlg{
  position:relative;z-index:3;width:100%;max-width:540px;flex:none;
  background:#fbe7b5;border:5px solid #8a4b1e;outline:4px solid #5a2f10;border-radius:6px;
  box-shadow:inset 0 0 0 4px #f3cf86,0 8px 0 #5a2f10;
  padding:calc(var(--vh)*2.2) 18px calc(var(--vh)*2.4);min-height:calc(var(--vh)*21);
  font-family:"Courier New",ui-monospace,monospace;font-weight:700;color:#4a2a10;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.tag{position:absolute;top:-24px;left:14px;background:#8a4b1e;color:#ffe9b8;padding:2px 10px;font-size:13px;border:3px solid #5a2f10;line-height:1.4}
.nx{position:absolute;right:10px;bottom:4px;color:#8a4b1e;animation:nx .6s steps(2) infinite;font-size:20px}
@keyframes nx{50%{transform:translateY(3px)}}
.q{margin:0;width:100%;font-size:clamp(21px,min(7.4vw,calc(var(--vh)*3.9)),42px);line-height:1.28;display:flex;align-items:center;justify-content:center;min-height:2.6em}
.btns{position:relative;z-index:3;display:flex;gap:18px;align-items:center;justify-content:center;flex:none}
.pb{
  font-family:"Courier New",ui-monospace,monospace;font-weight:700;font-size:clamp(18px,5.4vw,26px);
  padding:calc(var(--vh)*1.3) 22px;border:4px solid #5a2f10;border-radius:4px;cursor:pointer;color:#fff;text-shadow:2px 2px 0 #0003;
  box-shadow:inset 0 -6px 0 #0003,0 6px 0 #5a2f10;transition:transform .1s steps(2);min-width:118px
}
.pb:hover{transform:translateY(-2px)}
.pb:active{transform:translateY(4px);box-shadow:inset 0 -6px 0 #0003,0 2px 0 #5a2f10}
#yes,#startBtn{background:#3fae5a}#no{background:#d9605a}
.pb:focus-visible,.mailbox:focus-visible,.music:focus-visible,.svb:focus-visible,.svok:focus-visible,.mail:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px #3d2b8a}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* corner controls */
.ctrl{position:fixed;z-index:40;top:8px;right:8px;display:flex;flex-direction:row;gap:8px}
.music{position:relative;width:40px;height:40px;font-size:20px;line-height:1;display:grid;place-items:center;background:#fbe7b5;border:4px solid #5a2f10;box-shadow:inset 0 0 0 2px #f3cf86,0 3px 0 #5a2f10;cursor:pointer;color:#4a2a10}
.music[aria-pressed="false"]{opacity:.7}
.music[aria-pressed="false"]::after{content:"";position:absolute;left:3px;right:3px;top:50%;border-top:4px solid #d9605a;transform:rotate(-38deg)}

/* start screen */
.start{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:28px;padding:24px;background:linear-gradient(#6c4a9e 0%,#c9648f 38%,#ff9a6b 72%,#ffd27a 100%);transition:opacity .5s steps(5);overflow:hidden}
.start::before{content:"";position:absolute;left:50%;bottom:-70px;width:200px;height:200px;margin-left:-100px;border-radius:50%;background:#fff1a8;box-shadow:0 0 0 14px #ffe08a88,0 0 0 32px #ffc46a55,0 0 90px 45px #ffb36b66}
.start>*{position:relative;z-index:1}
.start.out{opacity:0;pointer-events:none}
.start .dlg{max-width:420px;min-height:0}
.start .q{min-height:0;font-size:clamp(20px,6vw,28px)}

/* ===================== Stardew-style mailbox + letters ===================== */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;background:rgba(8,18,50,.62)}
.sv{
  position:relative;width:min(94vw,540px);max-height:88vh;display:flex;flex-direction:column;
  background:#d9893a;border:6px solid #5a2f10;border-radius:4px;padding:12px;
  box-shadow:inset 0 0 0 4px #f0b968,0 0 0 4px #8a4b1e,0 12px 0 4px rgba(0,0,0,.35);
  animation:unfold .5s steps(5,end) both;
}
@keyframes unfold{from{transform:translateY(40px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.sv-rib{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;
  background:#8a4b1e;border:4px solid #5a2f10;color:#ffe9b8;padding:7px 16px;
  font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.3;box-shadow:inset 0 0 0 2px #b4672a
}
.sv-in{
  flex:1;min-height:0;overflow:auto;margin-top:8px;padding:20px 18px 12px;
  background:#f8dca8;border:4px solid #8a4b1e;box-shadow:inset 0 0 0 3px #ebc88a;
  background-image:radial-gradient(#ecc98e 1px,transparent 1.5px);background-size:9px 9px;
}
.inhint{margin:0 0 16px;text-align:center;font-family:'Courier New',monospace;font-weight:700;font-size:clamp(15px,4.2vw,18px);color:#6b3a1a}
.mail{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:0 0 14px;padding:10px 14px;background:#ffefc6;border:4px solid #5a2f10;box-shadow:inset 0 0 0 3px #f3cf86,0 5px 0 #5a2f10;cursor:pointer;font-family:'Courier New',monospace;font-weight:700;font-size:clamp(16px,4.6vw,20px);color:#4a2a10;line-height:1.25}
.mail:hover{transform:translateY(-2px)}
.mail.done{background:#f1d79c}
.mail .new{margin-left:auto;flex:none;background:#d9605a;color:#fff;font-size:11px;padding:4px 7px;border:3px solid #5a2f10;animation:newblink .9s steps(1) infinite}
@keyframes newblink{50%{background:#ff8f6b}}
#reader h2{margin:0 0 6px;text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(11px,3.3vw,14px);line-height:1.7;color:#9b2f45}
.hr{height:calc(var(--u)*2.5);margin:0 auto 14px;width:70%;background-repeat:repeat-x;background-position:center;background-size:auto 100%;image-rendering:pixelated}
#lbody p{margin:0 0 .75em;font-family:'VT323','Courier New',monospace;font-size:clamp(22px,6.2vw,29px);line-height:1.18;color:#4a2a10;white-space:pre-line}
#lbody p.sig{color:#9b2f45}
#lbody .b{visibility:hidden}
.skip{margin:6px 0 0;text-align:center;font-family:'Press Start 2P',monospace;font-size:9px;color:#8a4b1e;opacity:.8}
.sv-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px}
.svb{font-family:'Press Start 2P',monospace;font-size:11px;padding:12px 12px;background:#f4b855;color:#4a2a12;border:4px solid #5a2f10;cursor:pointer;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 0 #5a2f10}
.svok{margin-left:auto;width:58px;height:58px;display:grid;place-items:center;background:#4fbf5f;border:4px solid #5a2f10;cursor:pointer;box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2),0 5px 0 #5a2f10;color:#fff;font-size:34px;line-height:1;text-shadow:2px 2px 0 #1f6b2c;font-family:'Press Start 2P',monospace}
.svok:active,.svb:active{transform:translateY(3px)}

/* ambient */
.amb{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.amb .spr{position:absolute}
.rise{animation:rise linear forwards}
@keyframes rise{from{transform:translate(0,0)}50%{transform:translate(16px,-55vh)}to{transform:translate(-8px,-115vh)}}
.fall{animation:fall linear forwards}
@keyframes fall{from{transform:translate(0,0) rotate(0)}50%{transform:translate(28px,55vh) rotate(160deg)}to{transform:translate(-10px,112vh) rotate(320deg)}}
.bf{position:absolute;animation:fly linear infinite}
.bf .spr{position:absolute;left:0;top:0}
.bf .f1{animation:fl1 .5s steps(1,end) infinite}
.bf .f2{animation:fl2 .5s steps(1,end) infinite}
@keyframes fl1{0%{opacity:1}50%{opacity:0}}
@keyframes fl2{0%{opacity:0}50%{opacity:1}}
@keyframes fly{0%{transform:translate(-60px,0)}25%{transform:translate(28vw,-40px)}50%{transform:translate(55vw,30px)}75%{transform:translate(82vw,-30px)}100%{transform:translate(112vw,10px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;animation-delay:0s!important}
  .amb,.cl,.star{display:none}
}
</style>
<script>
/* If an image is not found at assets/<name>.png, try other likely paths (including the original upload names). */
(function(){
  var CAND={
    sign:['assets/sign.png','Assets/sign.png','./sign.png','sign.png','assets/1000037414.png','Assets/1000037414.png','1000037414.png'],
    brown:['assets/brown.png','Assets/brown.png','./brown.png','brown.png','assets/1000037412.png','Assets/1000037412.png','1000037412.png'],
    cream:['assets/cream.png','Assets/cream.png','./cream.png','cream.png','assets/1000037413.png','Assets/1000037413.png','1000037413.png']
  };
  window.__imgErr=function(img){
    var list=CAND[img.getAttribute('data-asset')]||[],i=+(img.getAttribute('data-try')||0)+1;
    if(i<list.length){img.setAttribute('data-try',i);img.src=list[i]}
  };
  /* original uploads have a white / checkered background baked in: remove it in the browser */
  window.__imgLoad=function(img){
    if(img.getAttribute('data-clean')||!/1000037\d+\.png/.test(img.currentSrc||img.src))return;
    img.setAttribute('data-clean','1');
    try{
      var key=img.getAttribute('data-asset'),minc=key==='sign'?232:(key==='cream'?236:250),spread=key==='sign'?10:6;
      var W=img.naturalWidth,H=img.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;
      var x=c.getContext('2d');x.drawImage(img,0,0);var d=x.getImageData(0,0,W,H),a=d.data,seen=new Uint8Array(W*H),st=[];
      function bg(p){var i=p*4,r=a[i],g=a[i+1],b=a[i+2];return a[i+3]===0||(Math.min(r,g,b)>=minc&&Math.max(r,g,b)-Math.min(r,g,b)<=spread)}
      function push(p){if(!seen[p]&&bg(p)){seen[p]=1;st.push(p)}}
      for(var i=0;i<W;i++){push(i);push((H-1)*W+i)}for(var j=0;j<H;j++){push(j*W);push(j*W+W-1)}
      while(st.length){var p=st.pop(),px=p%W,py=(p-px)/W;a[p*4+3]=0;
        if(px>0)push(p-1);if(px<W-1)push(p+1);if(py>0)push(p-W);if(py<H-1)push(p+W)}
      var x0=W,y0=H,x1=0,y1=0;
      for(var q=0;q<W*H;q++){if(a[q*4+3]){var qx=q%W,qy=(q-qx)/W;if(qx<x0)x0=qx;if(qx>x1)x1=qx;if(qy<y0)y0=qy;if(qy>y1)y1=qy}}
      x.putImageData(d,0,0);
      var o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
      img.src=o.toDataURL('image/png');
    }catch(e){}
  };
})();
</script>
</head>
<body>

<div class="ctrl">
  <button class="music" id="music" type="button" aria-label="Toggle music" aria-pressed="false">&#9834;</button>
  <button class="music" id="sfx" type="button" aria-label="Toggle sound effects" aria-pressed="true">🔊</button>
</div>

<div class="start" id="start" role="dialog" aria-label="Start">
  <section class="dlg">
    <span class="tag">Psst...</span>
    <p class="q">Someone made a little farm just for you.</p>
    <span class="nx" aria-hidden="true">▼</span>
  </section>
  <div class="btns"><button class="pb" id="startBtn" type="button">TAP TO OPEN 💌</button></div>
</div>

<div class="page" id="page">
<div class="world" id="world" aria-hidden="true">
  <div class="sky" id="sky"></div>
  <div class="ml" id="m1"></div>
  <div class="ml" id="m2"></div>
  <div class="ml" id="m3"></div>
  <div class="grass" id="grass"></div>
  <div class="dirt" id="dirt"></div>
  <div class="decor" id="decor"></div>
</div>

<main class="ui" id="ui">
  <img class="sign" src="assets/sign.png" data-asset="sign" onerror="__imgErr(this)" onload="__imgLoad(this)" alt="Wooden sign reading JEAM ABBY KEITH PANGANIBAN" width="1100" height="488">

  <section class="scene" id="scene" aria-label="Cabin and mailbox">
    <div class="cabin" id="cabin" aria-hidden="true"></div>
    <div class="mbwrap" id="mbwrap">
      <button class="mailnote" id="bubble" type="button" tabindex="-1" aria-hidden="true"><span class="badge" id="badge">3</span></button>
      <button class="mailbox unread" id="mailbox" type="button" aria-label="You have 3 new messages. Open the mailbox"></button>
    </div>
  </section>

  <section class="stage" id="stage" aria-label="Two chickens on the farm">
    <div class="pair">
      <div class="hen brown" id="henB">
        <span class="shadow"></span>
        <div class="bob"><img src="assets/brown.png" data-asset="brown" onerror="__imgErr(this)" onload="__imgLoad(this)" alt="Brown pixel chicken" width="960" height="960"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const small=innerWidth<520;

/* ---------- tiny pixel sprite engine (SVG data URIs) ---------- */
const PAL={k:'#3a2214',r:'#d2432c',R:'#8f2a1c',l:'#ee6a4d',y:'#ffd93a',Y:'#d99a1e',w:'#fff6dd',g:'#4b9b3a',G:'#2e6a2b',h:'#82c957',b:'#9a6431',B:'#5a3418',t:'#d9a25a',p:'#ff8fb1',P:'#d9557f',o:'#f08a3c',s:'#c4cfe2',S:'#8892a6',u:'#6ec5ff',c:'#ffe6b0',L:'#98dc70'};
function sprite(rows,over){
  const pal=Object.assign({},PAL,over||{}),h=rows.length,w=rows[0].length;let r='';
  rows.forEach((row,y)=>{let x=0;while(x<w){const ch=row[x];if(ch==='.'||!pal[ch]){x++;continue}let e=x;while(e<w&&row[e]===ch)e++;r+=`<rect x="${x}" y="${y}" width="${e-x}" height="1" fill="${pal[ch]}"/>`;x=e}});
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${r}</svg>`;
  return {url:'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")',w,h};
}
function el(s,px,cls){
  const d=document.createElement('span');d.className='spr'+(cls?' '+cls:'');
  if(typeof px==='number'){d.style.width=s.w*px+'px';d.style.height=s.h*px+'px'}
  else{d.style.width=`calc(${px}*${s.w})`;d.style.height=`calc(${px}*${s.h})`}
  d.style.backgroundImage=s.url;return d;
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const grid=(w,h)=>Array.from({length:h},()=>Array(w).fill('.'));
const rows=g=>g.map(r=>r.join(''));

/* ---------- sprite art ---------- */
const HEART=sprite(['.pp.pp.','pwppppp','pppppPP','.ppppP.','..pPP..','...P...']);
const SPARK=['..y..','..y..','yywyy','..y..','..y..'];
const SPK={pink:sprite(SPARK,{y:'#ff8fb1'}),gold:sprite(SPARK,{y:'#ffd93a'}),white:sprite(SPARK,{y:'#ffffff',w:'#ffe3ef'})};
const FLOWER=['.p.p.','ppypp','.ppp.','..g..','.gg..','..g..'];
const FL=[
  sprite(FLOWER,{p:'#ff8fb1',y:'#ffe066'}),sprite(FLOWER,{p:'#fffaf0',y:'#f08a3c'}),
  sprite(FLOWER,{p:'#9bb8ff',y:'#ffe066'}),sprite(FLOWER,{p:'#ffe066',y:'#f08a3c'}),sprite(FLOWER,{p:'#ffb3d1',y:'#fff6dd'}),sprite(FLOWER,{p:'#c79bff',y:'#ffe066'})];
const TREE=sprite(['.....kkkkkk.....','...kkgghhhhkk...','..kghhhhhhhhgk..','.kghhhhwhhhhhgk.','.kghhhhhhhhhhgk.','kgghhhhhhhhhhggk','kghhhhhhhhhhhhgk','kghhhwhhhhhhhhgk','kgghhhhhhhhhhggk','.kgghhhhhhhhggk.','.kGgghhhhhhggGk.','..kGGgggggggGk..','...kkGGGGGGkk...','.....kkbbkk.....','......kbBk......','......kbBk......','......kbBk......','.....kbbBBk.....','....kbbbBBBk....','....kkkkkkkk....']);
const BUSH=sprite(['................','...kkkk....kkk..','..kghhgk..kghgk.','.kghhhhgkkghhhgk','kghhhhhhgghhhhgk','kgghhhhhhhhhhggk','kGgghhhhhhhhggGk','kkGgggggggggGGkk','..kkkkkkkkkkkk..']);
const CLOUD=sprite(['.......wwww.........','.....wwwwwwww..ww...','..wwwwwwwwwwwwwwww..','.wwwwwwwwwwwwwwwwww.','wwwwwwwwwwwwwwwwwwww','.ssssssssssssssssss.'],{w:'#ffffff',s:'#c9defa'});
const GCLOUD=sprite(['.......wwww.........','.....wwwwwwww..ww...','..wwwwwwwwwwwwwwww..','.wwwwwwwwwwwwwwwwww.','wwwwwwwwwwwwwwwwwwww','.ssssssssssssssssss.'],{w:'#a9b4c9',s:'#7f8aa3'});
const TEAR=sprite(['.u.','uwu','uuu','.u.']);
const BF_O=['Pp.k.pP','pppkppp','.ppkpp.','.pp.pp.'],BF_C=['...k...','..pkp..','..pkp..','...k...'];
const PETAL=sprite(['pp.','.pp'],{p:'#ffb3d1'});
const ENV=sprite(['kkkkkkkkkkkk','kwwwwwwwwwwk','kkwwwwwwwwkk','kwkwwwwwwkwk','kwwkwwwwkwwk','kwwwkppkwwwk','kwwwwkkwwwwk','kwwwwwwwwwwk','kkkkkkkkkkkk']);
const ENVO=sprite(['.....kk.....','...kkwwkk...','.kkwwwwwwkk.','kwwwwwwwwwwk','kwtttttttwwk','kwwwwwwwwwwk','kwwwwwwwwwwk','kwwwwwwwwwwk','kkkkkkkkkkkk']);

/* pine tree */
function pineSprite(){
  const W=15,H=26,g=grid(W,H);
  [{y:1,h:7,w:3},{y:7,h:8,w:5},{y:14,h:9,w:7}].forEach(t=>{
    for(let r=0;r<t.h;r++){
      const hw=Math.round(1+(t.w-1)*r/(t.h-1)),x0=7-hw,x1=7+hw;
      for(let x=x0;x<=x1;x++)g[t.y+r][x]=x>7?'g':'h';
      g[t.y+r][x0]='k';g[t.y+r][x1]='k';
      if(r===t.h-1)for(let x=x0;x<=x1;x++)g[t.y+r][x]='k';
    }
  });
  for(let y=22;y<26;y++){g[y][6]='k';g[y][7]='b';g[y][8]='k'}
  g[25][6]='k';g[25][7]='k';g[25][8]='k';
  return sprite(rows(g),{h:'#4fae4a',g:'#2e7d3a'});
}
/* wooden fence tile */
function fenceTile(){
  const W=16,H=12,g=grid(W,H);
  for(let x=0;x<W;x++){g[2][x]='k';g[3][x]='b';g[4][x]='B';g[5][x]='k';g[7][x]='k';g[8][x]='b';g[9][x]='B';g[10][x]='k'}
  [[2,5],[10,13]].forEach(([a,b])=>{for(let y=0;y<H;y++)for(let x=a;x<=b;x++)g[y][x]=(x===a||x===b)?'k':(x===a+1?'t':'b');for(let x=a;x<=b;x++)g[0][x]='k'});
  return sprite(rows(g));
}
/* terrain tiles */
function grassTile(){
  const R=rng(7),g=grid(16,16).map(r=>r.map(()=>'h'));
  for(let i=0;i<10;i++){const x=Math.floor(R()*14),y=1+Math.floor(R()*14);g[y][x]='g';g[y][x+1]='g';g[y-1][x]='g'}
  for(let i=0;i<9;i++){g[Math.floor(R()*16)][Math.floor(R()*16)]='L'}
  return sprite(rows(g),{h:'#7ac43f',g:'#5fa92f',L:'#9ee05a'});
}
function dirtTile(){
  const R=rng(33),g=grid(16,16).map(r=>r.map(()=>'t'));
  for(let i=0;i<14;i++){g[Math.floor(R()*16)][Math.floor(R()*15)]='o'}
  for(let i=0;i<8;i++){g[Math.floor(R()*16)][Math.floor(R()*16)]='c'}
  for(let i=0;i<3;i++){const x=Math.floor(R()*14),y=Math.floor(R()*15);g[y][x]='s';g[y][x+1]='S'}
  return sprite(rows(g),{t:'#d6a05a',o:'#bf8744',c:'#e6b872',s:'#b9b2a4',S:'#8f897c'});
}
function dirtEdge(){
  const d=[1,2,3,2,1,1,2,4,3,2,1,2,3,2,1,1],g=grid(16,5);
  d.forEach((dep,x)=>{for(let y=5-dep;y<5;y++)g[y][x]='t'});
  return sprite(rows(g),{t:'#d6a05a'});
}
/* green mountains */
function mtnLayer(W,H,peaks,slope,minH,c){
  const g=grid(W,H);
  for(let x=0;x<W;x++){
    let best=minH,side=1;
    peaks.forEach(([px,h])=>{
      let dx=x-px;if(dx>W/2)dx-=W;if(dx<-W/2)dx+=W;
      const v=Math.floor(h-Math.abs(dx)*slope);
      if(v>best){best=v;side=dx}
    });
    const top=H-best;
    for(let y=top;y<H;y++)g[y][x]=side>0?'d':'f';
    if(side<=0)g[top][x]='h';
    if(side<=0&&top+1<H)g[top+1][x]='h';
  }
  return sprite(rows(g),{f:c.f,d:c.d,h:c.h});
}

/* ---------- the world: sky, stars, clouds, mountains, land, trees, flowers ---------- */
(function(){
  const sky=$('#sky'),decor=$('#decor');
  const R=rng(5);
  for(let i=0;i<28;i++){
    const s=document.createElement('i');s.className='star';
    s.style.left=(R()*100)+'%';s.style.top=(R()*17)+'%';s.style.animationDelay=(-R()*2.4)+'s';
    s.style.opacity=.6+R()*.4;sky.appendChild(s);
  }
  [[-3,22,2.6,0],[70,13,2.2,-20],[18,31,1.6,-35]].forEach(([x,y,sc,d])=>{
    const c=el(CLOUD,`calc(var(--u)*${sc})`,'cl');c.style.left=x+'vw';c.style.top=`calc(var(--vh)*${y})`;c.style.animationDelay=d+'s';sky.appendChild(c);
  });
  const far=mtnLayer(128,22,[[16,20],[52,17],[88,21],[116,15]],.55,8,{f:'#86c4da',d:'#62a5c4',h:'#b0dcea'});
  const mid=mtnLayer(112,17,[[30,15],[70,13],[100,16]],.75,5,{f:'#6cc96d',d:'#3d9c5d',h:'#9de57f'});
  const near=mtnLayer(96,11,[[14,10],[48,9],[78,10]],.9,3,{f:'#52b755',d:'#2d8b4b',h:'#8fe26e'});
  [['#m1',far,22,128,0],['#m2',mid,17,112,0],['#m3',near,11,96,0]].forEach(([id,sp,H,W])=>{
    const n=$(id);n.style.height=`calc(var(--mu)*${H})`;n.style.top=`calc(var(--hor) - var(--mu)*${H} + 1px)`;
    n.style.backgroundImage=sp.url;n.style.backgroundSize=`calc(var(--mu)*${W}) calc(var(--mu)*${H})`;
  });
  const gt=grassTile(),dt=dirtTile(),de=dirtEdge();
  const gr=$('#grass'),di=$('#dirt');
  gr.style.backgroundImage=gt.url;gr.style.backgroundSize='calc(var(--u)*16) calc(var(--u)*16)';
  di.style.backgroundImage=dt.url;di.style.backgroundSize='calc(var(--u)*16) calc(var(--u)*16)';di.style.setProperty('--edge',de.url);

  const put=(n,css)=>{Object.assign(n.style,css);decor.appendChild(n);return n};
  // fence on the left, behind everything
  const fence=fenceTile(),fn=document.createElement('div');
  put(fn,{position:'absolute',left:'0',width:'34%',top:'calc(var(--vh)*44)',height:'calc(var(--u)*12)',
    backgroundImage:fence.url,backgroundRepeat:'repeat-x',backgroundSize:'calc(var(--u)*16) 100%',imageRendering:'pixelated'});
  // trees: pine behind the cabin, round trees on the left
  const pine=pineSprite();
  put(el(pine,'calc(var(--u)*1.7)'),{left:'27vw',top:'calc(var(--vh)*22)'});
  put(el(TREE,'calc(var(--u)*1.8)'),{left:'-3vw',top:'calc(var(--vh)*38)'});
  put(el(TREE,'calc(var(--u)*1.2)'),{left:'21vw',top:'calc(var(--vh)*38.5)'});
  put(el(BUSH,'calc(var(--u)*1.6)'),{left:'30vw',top:'calc(var(--vh)*48)'});
  put(el(BUSH,'calc(var(--u)*1.4)'),{right:'-2vw',top:'calc(var(--vh)*55)'});
  // flowers on the grass (and a few at the edges)
  const r2=rng(21),n=small?64:90;
  for(let i=0;i<n;i++){
    const f=el(FL[Math.floor(r2()*FL.length)],small?3:4);
    f.style.left=(1+r2()*96)+'%';f.style.top=`calc(var(--vh)*${40+r2()*17})`;decor.appendChild(f);
  }
  for(let i=0;i<14;i++){
    const f=el(FL[Math.floor(r2()*FL.length)],small?3:4);
    const left=r2()<.5?r2()*5:93+r2()*5;
    f.style.left=left+'%';f.style.top=`calc(var(--vh)*${60+r2()*36})`;decor.appendChild(f);
  }
})();

/* ---------- audio: sound effects + typing blips (context created on first tap) ---------- */
let ac=null,sfxBus=null,musicBus=null,sfxOn=true,noiseBuf=null;
function unlock(){
  if(!ac){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();sfxBus=ac.createGain();sfxBus.gain.value=.55;sfxBus.connect(ac.destination);
    musicBus=ac.createGain();musicBus.gain.value=0;musicBus.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.3),ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended')ac.resume();
}
function tone(f,t0,dur,type,vol,f2){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(sfxBus);o.start(t0);o.stop(t0+dur+.03);
}
function noise(t0,dur,vol,freq){
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t0);s.stop(t0+dur);
}
const SFX=fn=>()=>{if(sfxOn&&ac)fn(ac.currentTime)};
const blip=SFX(t=>tone(380+Math.random()*320,t,.06,'square',.05));
const sClick=SFX(t=>{tone(520,t,.06,'square',.06);tone(780,t+.06,.08,'square',.06)});
const sStep=SFX(t=>{tone(150,t,.07,'triangle',.14,90);noise(t,.04,.05,900)});
const sKiss=SFX(t=>{tone(700,t,.09,'sine',.18,1700);noise(t+.09,.05,.25,2500);[1047,1319,1568,2093].forEach((f,i)=>tone(f,t+.18+i*.09,.35,'sine',.1))});
const sSad=SFX(t=>{[392,349,294].forEach((f,i)=>tone(f,t+i*.2,.3,'triangle',.14))});
const sCreak=SFX(t=>{tone(160,t,.4,'sawtooth',.05,300);tone(1175,t+.45,.2,'sine',.1);tone(1568,t+.58,.3,'sine',.1)});
const sRustle=SFX(t=>{noise(t,.18,.18,3000);noise(t+.12,.12,.12,5000)});

/* ---------- typewriter (Stardew-style blips) ---------- */
function typeText(node,text,cb,speed){
  clearInterval(node._t);node.textContent='';
  const ch=Array.from(text);let i=0;
  if(reduce){node.textContent=text;if(cb)cb();return}
  node._t=setInterval(()=>{
    const c=ch[i++];node.textContent=ch.slice(0,i).join('');
    if(c!==' '&&i%2===0)blip();
    if(i>=ch.length){clearInterval(node._t);if(cb)cb()}
  },speed||34);
}
/* letters: reserve the full layout, reveal text as it types */
function typeReserve(p,text,cb,speed){
  clearInterval(p._t);
  const a=document.createElement('span'),b=document.createElement('span');b.className='b';
  p.textContent='';p.append(a,b);
  const ch=Array.from(text);let i=0;
  const set=n=>{a.textContent=ch.slice(0,n).join('');b.textContent=ch.slice(n).join('')};
  if(reduce){set(ch.length);if(cb)cb();return}
  set(0);
  p._t=setInterval(()=>{
    const c=ch[i++];set(i);
    const now=performance.now();
    if(c!==' '&&c!=='\n'&&now-(typeReserve._b||0)>55){typeReserve._b=now;blip()}
    if(!userScrolled&&i%10===0){
      const r=a.getBoundingClientRect(),sr=svin.getBoundingClientRect();
      if(r.bottom>sr.bottom-30)svin.scrollTop+=r.bottom-sr.bottom+60;
    }
    if(i>=ch.length){clearInterval(p._t);if(cb)cb()}
  },speed||18);
}

/* ---------- cabin ---------- */
function cabinSprite(){
  const W=32,H=28,g=grid(W,H);
  const px=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<H)g[y][x]=c};
  const rect=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(x+i,y+j,c)};
  rect(22,0,4,9,'S');for(let y=0;y<9;y++){px(22,y,'k');px(25,y,'k')}rect(22,0,4,1,'k');
  rect(3,13,26,14,'b');
  for(const y of [15,18,21,24])rect(3,y,26,1,'B');
  for(let y=13;y<27;y++){px(3,y,'k');px(28,y,'k')}
  for(let y=2;y<=12;y++){
    const hw=Math.min(16,Math.round(3+(y-2)*1.45)),x0=16-hw,x1=15+hw;
    for(let x=x0;x<=x1;x++)px(x,y,(y%2===0)?'r':'R');
    for(let x=x0+1;x<x1;x+=3)px(x,y,'l');
    px(x0,y,'k');px(x1,y,'k');
  }
  for(let x=0;x<W;x++){px(x,12,'k')}
  for(let x=1;x<W-1;x++)px(x,13,'B');
  rect(14,2,4,1,'k');
  rect(13,18,6,9,'B');for(let y=18;y<27;y++){px(13,y,'k');px(18,y,'k')}rect(13,18,6,1,'k');
  px(16,22,'t');px(16,23,'t');px(17,23,'y');
  rect(12,27,8,1,'t');
  for(const x of [5,21]){
    rect(x,17,6,5,'y');rect(x,17,6,1,'k');rect(x,21,6,1,'k');
    for(let y=17;y<22;y++){px(x,y,'k');px(x+5,y,'k')}
    for(let y=18;y<21;y++){px(x+2,y,'w');px(x+3,y,'w')}
    rect(x-1,22,8,2,'B');px(x,22,'p');px(x+2,22,'y');px(x+4,22,'p');px(x+6,22,'w');
    px(x,21,'g');px(x+3,21,'g');px(x+5,21,'g');
  }
  rect(2,27,28,1,'S');
  return sprite(rows(g),{S:'#9aa0ad'});
}
(function(){
  const C=cabinSprite(),cab=$('#cabin');
  cab.style.width=`calc(var(--u)*${C.w})`;cab.style.height=`calc(var(--u)*${C.h})`;
  cab.appendChild(el(C,'var(--u)'));
  for(let i=0;i<3;i++){const s=document.createElement('i');s.className='smoke';s.style.left=`calc(var(--u)*23)`;s.style.top=`calc(var(--u)*-2)`;s.style.animationDelay=(-i*1.1)+'s';cab.appendChild(s)}
})();

const stage=$('#stage'),fx=$('#fx'),qEl=$('#q'),henB=$('#henB'),henC=$('#henC');
(function(){
  const rc=$('#raincloud');const c=el(GCLOUD,5);c.style.width='100%';c.style.height='auto';c.style.aspectRatio='20/6';rc.appendChild(c);
  [18,40,62,80].forEach((l,i)=>{const d=document.createElement('i');d.className='rain';d.style.left=l+'%';d.style.animationDelay=(-i*.22)+'s';rc.appendChild(d)});

function rel(n){const s=stage.getBoundingClientRect(),r=n.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top,w:r.width,h:r.height,l:r.left-s.left}}
function heart(x,y,px,delay){
  const h=el(HEART,px,'fh');h.style.left=x+'px';h.style.top=y+'px';if(delay)h.style.animationDelay=delay+'ms';fx.appendChild(h);setTimeout(()=>h.remove(),2600+(delay||0));
}
function spark(x,y,kind,px){
  const s=el(SPK[kind],px,'fs');s.style.left=x+'px';s.style.top=y+'px';s.style.animationDelay=Math.floor(Math.random()*500)+'ms';fx.appendChild(s);setTimeout(()=>s.remove(),1800);
}
function burst(){
  const a=rel(henB),b=rel(henC),mx=(a.x+b.x)/2,top=Math.min(a.y,b.y);
  const hp=Math.max(2,Math.round(a.w/42));
  [a,b].forEach(p=>{for(let i=0;i<4;i++)heart(p.x+(Math.random()-.5)*p.w*.7,p.y+p.h*.15,hp+Math.floor(Math.random()*2),i*220)});
  const bp=Math.max(5,Math.round(a.w/14)),big=el(HEART,bp,'fpulse');big.style.left=mx+'px';big.style.top=(top-HEART.h*bp-6)+'px';fx.appendChild(big);
  const m=document.createElement('span');m.className='mwah';m.textContent='MWAAA!';m.style.left=mx+'px';m.style.top=(top+a.h*.35)+'px';fx.appendChild(m);setTimeout(()=>m.remove(),2100);
  const kinds=['pink','gold','white'],sp=Math.max(2,Math.round(a.w/40));
  for(let i=0;i<16;i++){
    const ang=Math.random()*Math.PI*2,rad=(a.w*.5+Math.random()*a.w*.9);
    spark(mx+Math.cos(ang)*rad,top+a.h*.55+Math.sin(ang)*rad*.55,kinds[i%3],sp);
  }
}
function trickle(){
  const p=rel(Math.random()<.5?henB:henC),hp=Math.max(2,Math.round(p.w/42));
  heart(p.x+(Math.random()-.5)*p.w*.6,p.y+p.h*.1,hp+Math.floor(Math.random()*2));
  const mx=(rel(henB).x+rel(henC).x)/2;
  spark(mx+(Math.random()-.5)*p.w*2,p.y+p.h*(.1+Math.random()*.7),Math.random()<.5?'pink':'gold',Math.max(2,Math.round(p.w/42)));
}

    'kRRRRRRRRRRRRRRkBBBk','.kRRRRRRRRRRRRRRRRk.','..kkkkkkkkkkkkkkkk..',
    '.......kbbtBk.......','.......kbtbBk.......','.......kbbtBk.......','.......kbtbBk.......','.......kbbtBk.......','.......kbtbBk.......','.......kbbtBk.......','.......kbtbBk.......',
    '....kBBBBBBBBBBk....','....kkkkkkkkkkkk....']);
  const DOOR=sprite(['kwwrk','krrrk','krrrk','krrrk','kryrk','krrrk','krrrk','krrrk','kRRRk']);

function updateBubble(){
  const left=LETTERS.length-read.size;
  if(left>0){
    bubble.hidden=false;badge.textContent=left;mbx.classList.add('unread');
    mbx.setAttribute('aria-label','You have '+left+(left===1?' new message':' new messages')+'. Open the mailbox');
  }else{
    bubble.hidden=true;mbx.classList.remove('unread');mbx.setAttribute('aria-label','Open the mailbox');
  }
}
function renderInbox(){
  mlist.innerHTML='';
  LETTERS.forEach((L,i)=>{
    const done=read.has(i),b=document.createElement('button');
    b.type='button';b.className='mail'+(done?' done':'');
    b.appendChild(el(done?ENVO:ENV,4));
    const t=document.createElement('span');t.textContent=done?L.title:'Mail '+(i+1);b.appendChild(t);
    if(!done){const n=document.createElement('span');n.className='new';n.textContent='NEW!';b.appendChild(n)}
    b.addEventListener('click',()=>{sClick();openLetter(i)});
    mlist.appendChild(b);
  });

}
function showInbox(){
  typing++;

function openLetter(i){
  read.add(i);const id=++typing;
  const L=LETTERS[i];lTitle.textContent=L.title;lBody.innerHTML='';
  const texts=L.text.split('\n\n'),ps=texts.map((t,k)=>{const p=document.createElement('p');if(k===texts.length-1)p.className='sig';lBody.appendChild(p);return p});
  inbox.hidden=true;reader.hidden=false;backBtn.hidden=false;rib.textContent='LETTER '+(i+1)+' / '+LETTERS.length;
  svin.scrollTop=0;letterBox.style.animation='none';void letterBox.offsetWidth;letterBox.style.animation='';
  skipEl.hidden=false;userScrolled=false;
  const sp=L.text.length>1800?6:L.text.length>1000?10:16;
  const finish=()=>{typing++;ps.forEach((p,k)=>{clearInterval(p._t);typeReserveDone(p,texts[k])});skipEl.hidden=true};
  lBody.onclick=finish;
  let k=0;
  (function nxt(){
    if(id!==typing)return;
    if(k>=ps.length){skipEl.hidden=true;return}
    const idx=k++;typeReserve(ps[idx],texts[idx],()=>setTimeout(nxt,140),sp);
    ps[idx].scrollIntoView&&0;
  })();
  sRustle();updateBubble();backBtn.focus({preventScroll:true});
}
function typeReserveDone(p,text){p.textContent=text}

let lastFocus=null,busy=false;

/* ---------- music (generated) ---------- */
const musicBtn=$('#music'),sfxBtn=$('#sfx');
let sched=null,step=0,next=0,on=false;
const BPM=70,EIGHTH=60/BPM/2;
const CH=[[48,52,55,60],[45,48,52,57],[41,45,48,53],[43,47,50,55]];
const MEL=[[76,0,79,0,81,79,0,76],[81,0,79,0,76,0,72,0],[74,0,72,0,69,0,72,74],[79,0,76,0,74,0,72,0]];
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(m,t,dur,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+dur+.05);
}
function tick(){
  while(next<ac.currentTime+.4){
    const bar=Math.floor(step/8)%4,s=step%8,ch=CH[bar];
    if(s===0)note(ch[0]-12,next,EIGHTH*7,'sine',.28);
    note(ch[1+(s%3)],next,EIGHTH*1.8,'triangle',.09);
    const m=MEL[bar][s];if(m)note(m,next,EIGHTH*2.6,'sine',.16);
    next+=EIGHTH;step++;
  }
}
function setMusic(v){
  unlock();if(!ac)return;
  on=v;musicBtn.setAttribute('aria-pressed',on);
  musicBus.gain.cancelScheduledValues(ac.currentTime);
  if(on){
    musicBus.gain.linearRampToValueAtTime(.5,ac.currentTime+1.2);
    step=0;next=ac.currentTime+.1;clearInterval(sched);sched=setInterval(tick,120);tick();
  }else{
    musicBus.gain.linearRampToValueAtTime(0,ac.currentTime+.6);
    setTimeout(()=>{if(!on)clearInterval(sched)},700);
  }
}
musicBtn.addEventListener('click',()=>setMusic(!on));
sfxBtn.addEventListener('click',()=>{
  unlock();sfxOn=!sfxOn;sfxBtn.setAttribute('aria-pressed',sfxOn);sfxBtn.textContent=sfxOn?'🔊':'🔇';
  if(sfxOn)sClick();
});

/* ---------- start screen (unlocks sound, then the farm begins) ---------- */
$('#startBtn').addEventListener('click',()=>{
  unlock();sClick();setMusic(true);
  document.body.classList.add('go');

  const full=qEl.textContent;
  setTimeout(()=>typeText(qEl,full),reduce?0:1250);
});
})();
