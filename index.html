<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c4a9e">
<title>AJ's Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --vh:1vh;
  --u:clamp(2.4px,calc(var(--vh)*.55),6px);
  --mu:clamp(3px,calc(var(--hor)*.0318),12px);
  --mb:calc(var(--u)*.72);
  --ftop:calc(56px + min(100vw - 20px,520px,var(--vh)*46)*.4436 + var(--vh)*1.5);
  --hor:calc(var(--ftop) + var(--vh)*4);
  --wood:#8a4b1e; --wood-d:#5a2f10; --paper:#fbe7b5; --ink:#4a2a10;
}
@supports (height:1svh){:root{--vh:1svh}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:'VT323','Courier New',monospace;color:var(--ink);background:#2f6fd0;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
img{image-rendering:pixelated}
.spr{display:inline-block;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;flex:none}

/* ===================== the world (sky, mountains, land) ===================== */
.page{position:relative;min-height:calc(var(--vh)*100);overflow:hidden}
.world{position:absolute;inset:0;overflow:hidden}
.sky{position:absolute;left:0;right:0;top:0;height:var(--hor);background:linear-gradient(#1a1650 0%,#3b2a7c 24%,#8a3f93 48%,#d9617f 68%,#ff9a5c 86%,#ffd27a 100%)}
.sun{position:absolute;left:68%;top:calc(var(--hor)*.36);width:calc(var(--hor)*.5);height:calc(var(--hor)*.5);border-radius:50%;background:#fff1a8;box-shadow:0 0 0 calc(var(--hor)*.03) #ffe08a88,0 0 0 calc(var(--hor)*.07) #ffc46a55,0 0 calc(var(--hor)*.3) calc(var(--hor)*.12) #ffb36b66}
.star{position:absolute;width:3px;height:3px;background:#fff;animation:tw 2.4s steps(1) infinite}
@keyframes tw{50%{opacity:.25}}
.cl{position:absolute;animation:cl 70s linear infinite alternate}
@keyframes cl{from{transform:translateX(-6vw)}to{transform:translateX(10vw)}}
.ml{position:absolute;left:0;right:0;background-repeat:repeat-x;image-rendering:pixelated}
.grass{position:absolute;left:0;right:0;top:var(--hor);bottom:0;image-rendering:pixelated}
.dirt{position:absolute;left:0;right:0;top:calc(var(--vh)*57);bottom:0;image-rendering:pixelated}
.dirt::before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*-5);height:calc(var(--u)*5);background-repeat:repeat-x;background-size:calc(var(--u)*16) 100%;background-image:var(--edge);image-rendering:pixelated}
.decor{position:absolute;inset:0;pointer-events:none}
.decor .spr{position:absolute}

/* ===================== foreground ===================== */
.ui{
  position:relative;z-index:5;min-height:calc(var(--vh)*100);max-width:620px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(var(--vh)*1.5);
  padding:56px 10px 34px;
}
.sign{
  display:block;width:min(calc(100vw - 20px),520px,calc(var(--vh)*46));height:auto;flex:none;
  filter:drop-shadow(0 5px 0 rgba(0,20,60,.3));visibility:hidden;
}
body.go .sign{visibility:visible;animation:signdrop 1.1s steps(9,end) both}
@keyframes signdrop{0%{transform:translateY(-140%)}58%{transform:translateY(7%)}78%{transform:translateY(-3%)}100%{transform:translateY(0)}}

/* the farm: everything is positioned in % of this box so it scales together.
   z-index of every object = its ground line (% from the top), so nearer things draw in front */
.farm{position:relative;flex:none;width:min(100%,860px,calc((var(--vh)*100 - 112px - min(100vw - 20px,520px,var(--vh)*46)*.4436)/1.38));aspect-ratio:1/1.38;container-type:inline-size}
.farm>*{position:absolute}
.tree{display:none;height:auto}
#p1{display:block;left:3%;top:6.68%;width:8%;z-index:20}
#p2{display:block;left:23%;top:6.92%;width:8%;z-index:19}
#p3{display:block;left:43%;top:7.80%;width:8%;z-index:20}
#p4{display:block;left:63%;top:6.68%;width:8%;z-index:19}
#p5{display:block;left:83%;top:6.68%;width:8%;z-index:20}
#p6{display:block;left:13%;top:15.72%;width:11%;z-index:29}
#p7{display:block;left:33%;top:14.14%;width:9%;z-index:28}
#p8{display:block;left:53%;top:15.41%;width:9%;z-index:29}
#p9{display:block;left:73%;top:15.72%;width:11%;z-index:29}
#p10{display:block;left:90.5%;top:16.04%;width:8.5%;z-index:29}
#p11{display:block;left:1%;top:24.41%;width:9%;z-index:38}
#p12{display:block;left:14%;top:26.91%;width:8.5%;z-index:40}
#p13{display:block;left:25%;top:26.28%;width:9%;z-index:40}
#p14{display:block;left:90.5%;top:26.41%;width:9%;z-index:40}
#w1{display:none}
#w2{display:none}
#w3{display:none}
#w4{display:none}
#w5{display:none}
#w6{display:none}
#w7{display:none}
#w8{display:none}
#w9{display:none}
#s1{display:none}
#s2{display:none}
#s3{display:none}
#s4{display:none}
#s5{display:none}
#s6{display:none}
#s7{display:none}
#s8{display:none}
.fence{left:calc(50% - 50vw);width:100vw;top:34%;height:calc(var(--u)*9);z-index:42;background-repeat:repeat-x;background-size:auto 100%;image-rendering:pixelated;pointer-events:none}
@supports (width:1cqw){.fence{height:10.5cqw;background-size:14cqw 100%}}
.hgrp{left:2%;top:30%;width:86%;aspect-ratio:820/568;z-index:73}
.hgrp>img{position:absolute;display:block;height:auto}
.hgrp .house{left:0;top:0;width:100%}
.ch{transform-origin:50% 100%;animation:idle 2.6s steps(1,end) infinite;z-index:2}
#girl{left:66%;top:78.8%;width:6.7%}
#boy{left:73%;top:78.8%;width:6.4%;animation-delay:-1.3s;animation-duration:3s}
#dog{left:59.4%;top:87.3%;width:6.1%;animation-delay:-.7s;animation-duration:3.4s}
#cat{left:79.8%;top:90.2%;width:5.9%;animation-delay:-2s;animation-duration:2.8s}
.pheart{position:absolute;left:81.5%;top:80%;opacity:0;animation:pheart 7s steps(1,end) infinite;z-index:3}
@keyframes pheart{0%,70%{opacity:0;transform:translateY(0)}72%{opacity:1;transform:translateY(0)}82%{opacity:1;transform:translateY(-90%)}92%{opacity:1;transform:translateY(-170%)}96%,100%{opacity:0;transform:translateY(-200%)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
.smoke{position:absolute;left:83.5%;top:2.7%;width:3%;aspect-ratio:1;background:#fff;opacity:0;animation:smoke 3.6s steps(7) infinite;z-index:1}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translate(60%,-900%) scale(1.7);opacity:0}}
.yard{left:12%;top:80.5%;width:85%;height:19%;visibility:hidden;pointer-events:none}
.jzone{left:24%;top:76%;width:66%;height:23.5%;visibility:hidden;pointer-events:none}
/* junimos */
.jun{left:0;top:0;width:9%;z-index:100;will-change:transform}
.jun img{display:block;width:100%;height:auto;image-rendering:pixelated}
.jun .shadow{left:12%;right:12%;bottom:-3px;height:7px}
.jb{position:relative;transform-origin:50% 100%;animation:jidle 1.8s steps(1,end) infinite}
@keyframes jidle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.95)}}
.jun.walk .jb{animation:jhop .44s steps(1,end) infinite}
@keyframes jhop{0%{transform:translateY(0) scale(1.1,.88)}20%{transform:translateY(-22%) scale(.94,1.08)}45%{transform:translateY(-34%) scale(.94,1.08)}70%{transform:translateY(-14%) scale(1,1)}85%{transform:translateY(0) scale(1.1,.88)}}
.jb.jump{animation:jjump .62s steps(1,end)}
@keyframes jjump{0%{transform:translateY(0) scale(1.12,.86)}15%{transform:translateY(-55%) scale(.92,1.1)}35%{transform:translateY(-75%) scale(.92,1.1) rotate(-12deg)}55%{transform:translateY(-45%) rotate(8deg)}75%{transform:translateY(-8%)}90%{transform:translateY(0) scale(1.12,.86)}}

/* mailbox */
.mbwrap{position:absolute;left:102%;bottom:0;z-index:5;flex:none;--mb:calc(var(--u)*.55)}
@supports (width:1cqw){.mbwrap{--mb:calc(86cqw*.0046)}}
.mailbox{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mb-art{position:relative;display:block}
.mb-art>.spr{position:absolute}
.mb-body{z-index:2;left:0;top:0}
.mb-door{z-index:3;transform-origin:50% 100%;transition:transform .5s steps(5,end)}
.mb-peek{z-index:1;left:0;top:0;transition:transform .9s steps(7,end) .35s}
.mb-flag{z-index:3;transition:transform .45s steps(4,end)}
.mailbox.unread .mb-peek{transform:translateY(calc(var(--mpx) * -4))}
.mailbox.open .mb-door{transform:scaleY(.16)}
.mailbox.open .mb-peek{transform:translateY(calc(var(--mpx) * -9))}
.mailbox.read .mb-flag,.mailbox.open .mb-flag{transform:rotate(-90deg)}
.mailbox:not(.open):hover .mb-art{animation:wiggle .5s steps(1,end) 2}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.mailnote{position:absolute;left:50%;bottom:calc(100% + 3px);margin-left:-14px;width:29px;height:22px;background:none;border:0;padding:0;cursor:pointer;z-index:4;animation:nb 1.1s steps(1,end) infinite}
.mailnote .spr{display:block}
.badge{position:absolute;right:-8px;top:-9px;min-width:15px;height:15px;padding:0 2px;background:#e0443a;border:2px solid #5a2f10;color:#fff;font:700 9px/11px "Courier New",monospace;text-align:center}
@keyframes nb{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* chickens wander in the yard below the house */
.hen{left:0;top:0;width:13%;z-index:100;will-change:transform}
.shadow{position:absolute;left:12%;right:12%;bottom:-4px;height:10px;border-radius:50%;background:rgba(70,40,10,.3)}
.fl{position:relative;transform:scaleX(var(--f,1))}
.bob{position:relative;transform-origin:50% 100%;animation:breathe 2.6s steps(1,end) infinite}
.hen.walk .bob{animation:hop .34s steps(1,end) infinite}
.hen.peck .bob{animation:peck .76s steps(1,end)}
@keyframes peck{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(3%) rotate(16deg)}40%{transform:translateY(0) rotate(2deg)}60%{transform:translateY(3%) rotate(16deg)}80%{transform:translateY(0) rotate(2deg)}}
.hen img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.96)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7%) rotate(-2deg)}}

/* pixel speech bubbles */
.say{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);pointer-events:none;z-index:7;white-space:nowrap}
.say-in{
  position:relative;padding:3px 10px 4px;background:#fff6dd;color:#7a2d45;
  font-family:'VT323','Courier New',monospace;font-size:clamp(18px,5vw,23px);line-height:1.1;
  border:3px solid #5a2f10;box-shadow:inset 0 0 0 2px #f6dca0,0 3px 0 #5a2f10;
  opacity:0;transition:opacity .45s steps(5,end)
}
.say-in::after{content:"";position:absolute;left:50%;bottom:-11px;width:8px;height:8px;margin-left:-5px;background:#fff6dd;border:3px solid #5a2f10;border-top:0;border-left:0;transform:rotate(45deg) translate(-2px,-2px)}
.say.on.hush .say-in{opacity:0}
.say.on .say-in{opacity:1;animation:sfloat 2.4s ease-in-out infinite}
@keyframes sfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* start screen dialogue */
.dlg{
  position:relative;z-index:3;width:100%;max-width:540px;flex:none;
  background:#fbe7b5;border:5px solid #8a4b1e;outline:4px solid #5a2f10;border-radius:6px;
  box-shadow:inset 0 0 0 4px #f3cf86,0 8px 0 #5a2f10;
  padding:calc(var(--vh)*2.2) 18px calc(var(--vh)*2.4);
  font-family:"Courier New",ui-monospace,monospace;font-weight:700;color:#4a2a10;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.tag{position:absolute;top:-24px;left:14px;background:#8a4b1e;color:#ffe9b8;padding:2px 10px;font-size:13px;border:3px solid #5a2f10;line-height:1.4}
.nx{position:absolute;right:10px;bottom:4px;color:#8a4b1e;animation:nx .6s steps(2) infinite;font-size:20px}
@keyframes nx{50%{transform:translateY(3px)}}
.q{margin:0;width:100%;line-height:1.28;display:flex;align-items:center;justify-content:center;text-align:center}
.btns{position:relative;z-index:3;display:flex;gap:18px;align-items:center;justify-content:center;flex:none}
.pb{
  font-family:"Courier New",ui-monospace,monospace;font-weight:700;font-size:clamp(18px,5.4vw,26px);
  padding:calc(var(--vh)*1.3) 22px;border:4px solid #5a2f10;border-radius:4px;cursor:pointer;color:#fff;text-shadow:2px 2px 0 #0003;
  box-shadow:inset 0 -6px 0 #0003,0 6px 0 #5a2f10;transition:transform .1s steps(2);min-width:118px
}
.pb:hover{transform:translateY(-2px)}
.pb:active{transform:translateY(4px);box-shadow:inset 0 -6px 0 #0003,0 2px 0 #5a2f10}
#startBtn{background:#3fae5a}
.pb:focus-visible,.mailbox:focus-visible,.music:focus-visible,.svb:focus-visible,.svok:focus-visible,.mail:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px #3d2b8a}


/* password gate */
.pw{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:3;width:100%;max-width:420px}
.pwl{font-family:'Press Start 2P',monospace;font-size:clamp(10px,2.8vw,13px);color:#fff;text-shadow:2px 2px 0 #5a2f10;letter-spacing:.04em;text-align:center}
#pw{width:min(100%,300px);font-family:"Courier New",monospace;font-weight:700;font-size:clamp(26px,8vw,36px);letter-spacing:.35em;text-indent:.35em;text-align:center;padding:10px 12px;background:#fff6dd;color:#4a2a10;border:4px solid #5a2f10;border-radius:4px;box-shadow:inset 0 0 0 3px #f3cf86,0 5px 0 #5a2f10;outline:none}
#pw:focus{box-shadow:inset 0 0 0 3px #f3cf86,0 5px 0 #5a2f10,0 0 0 6px #3d2b8a}
.pwerr{min-height:1.5em;margin:0;font-family:'Press Start 2P',monospace;font-size:clamp(9px,2.6vw,11px);line-height:1.5;color:#fff;text-shadow:2px 2px 0 #8f2a1c;text-align:center}
.shake{animation:shake .45s steps(6,end)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* corner controls */
.ctrl{position:fixed;z-index:40;top:8px;right:8px;display:flex;flex-direction:row;gap:8px}
.music{position:relative;width:40px;height:40px;font-size:20px;line-height:1;display:grid;place-items:center;background:#fbe7b5;border:4px solid #5a2f10;box-shadow:inset 0 0 0 2px #f3cf86,0 3px 0 #5a2f10;cursor:pointer;color:#4a2a10}
.music[aria-pressed="false"]{opacity:.7}
.music[aria-pressed="false"]::after{content:"";position:absolute;left:3px;right:3px;top:50%;border-top:4px solid #d9605a;transform:rotate(-38deg)}

/* start screen */
.start{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:28px;padding:24px;background:linear-gradient(#6c4a9e 0%,#c9648f 38%,#ff9a6b 72%,#ffd27a 100%);transition:opacity .5s steps(5);overflow:hidden}
.start::before{content:"";position:absolute;left:50%;bottom:calc(var(--vh)*12);width:150px;height:150px;margin-left:-75px;border-radius:50%;background:#fff1a8;box-shadow:0 0 0 12px #ffe08a88,0 0 0 26px #ffc46a55,0 0 70px 36px #ffb36b66}
.start::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--vh)*17);background:#3a2468;clip-path:polygon(0 55%,10% 55%,10% 35%,22% 35%,22% 15%,36% 15%,36% 40%,48% 40%,48% 22%,62% 22%,62% 5%,76% 5%,76% 30%,90% 30%,90% 48%,100% 48%,100% 100%,0 100%)}
.start>*{position:relative;z-index:1}
.start.out{opacity:0;pointer-events:none}
.start .dlg{max-width:420px}
.start .q{font-size:clamp(20px,6vw,28px);text-align:center;text-wrap:balance}

/* ===================== Stardew-style mailbox + letters ===================== */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;background:rgba(8,18,50,.62)}
.sv{
  position:relative;width:min(94vw,540px);max-height:88vh;display:flex;flex-direction:column;
  background:#d9893a;border:6px solid #5a2f10;border-radius:4px;padding:12px;
  box-shadow:inset 0 0 0 4px #f0b968,0 0 0 4px #8a4b1e,0 12px 0 4px rgba(0,0,0,.35);
  animation:unfold .5s steps(5,end) both;
}
@keyframes unfold{from{transform:translateY(40px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.sv-rib{
  position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;
  background:#8a4b1e;border:4px solid #5a2f10;color:#ffe9b8;padding:7px 16px;
  font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.3;box-shadow:inset 0 0 0 2px #b4672a
}
.sv-in{
  flex:1;min-height:0;overflow:auto;margin-top:8px;padding:20px 18px 12px;
  background:#f8dca8;border:4px solid #8a4b1e;box-shadow:inset 0 0 0 3px #ebc88a;
  background-image:radial-gradient(#ecc98e 1px,transparent 1.5px);background-size:9px 9px;
}
.inhint{margin:0 0 16px;text-align:center;font-family:'Courier New',monospace;font-weight:700;font-size:clamp(15px,4.2vw,18px);color:#6b3a1a}
.mail{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:100%;text-align:left;margin:0 0 14px;padding:10px 14px;background:#ffefc6;border:4px solid #5a2f10;box-shadow:inset 0 0 0 3px #f3cf86,0 5px 0 #5a2f10;cursor:pointer;font-family:'Courier New',monospace;font-weight:700;font-size:clamp(16px,4.6vw,20px);color:#4a2a10;line-height:1.25}
.mail:hover{transform:translateY(-2px)}
.mail>.spr:first-child{justify-self:start}
.mail .lbl{grid-column:2;display:flex;align-items:center;justify-content:center;min-width:2.2em;font-family:'Press Start 2P',monospace;font-size:clamp(26px,7vw,34px);line-height:1;color:#9b2f45;text-align:center;padding:6px 0}
.mail.done{background:#f1d79c}
.mail .new{grid-column:3;justify-self:end;background:#d9605a;color:#fff;font-size:11px;padding:4px 7px;border:3px solid #5a2f10;animation:newblink .9s steps(1) infinite}
@keyframes newblink{50%{background:#ff8f6b}}
#ltitle{display:none}
#reader h2{margin:0 0 6px;text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(11px,3.3vw,14px);line-height:1.7;color:#9b2f45}
.hr{height:calc(var(--u)*2.5);margin:0 auto 14px;width:70%;background-repeat:repeat-x;background-position:center;background-size:auto 100%;image-rendering:pixelated}
#lbody p{margin:0 0 .75em;font-family:'VT323','Courier New',monospace;font-size:clamp(22px,6.2vw,29px);line-height:1.18;color:#4a2a10;white-space:pre-line}
#lbody p.sig{color:#9b2f45}
#lbody .b{visibility:hidden}
.skip{margin:6px 0 0;text-align:center;font-family:'Press Start 2P',monospace;font-size:9px;color:#8a4b1e;opacity:.8}
.sv-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px}
.svb{font-family:'Press Start 2P',monospace;font-size:11px;padding:12px 12px;background:#f4b855;color:#4a2a12;border:4px solid #5a2f10;cursor:pointer;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 0 #5a2f10}
.svok{margin-left:auto;width:58px;height:58px;display:grid;place-items:center;background:#4fbf5f;border:4px solid #5a2f10;cursor:pointer;box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -5px 0 rgba(0,0,0,.2),0 5px 0 #5a2f10;color:#fff;font-size:34px;line-height:1;text-shadow:2px 2px 0 #1f6b2c;font-family:'Press Start 2P',monospace}
.svok:active,.svb:active{transform:translateY(3px)}


/* "under maintenance" note */
.note{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:18px;background:rgba(8,18,50,.5)}
.note-box{width:min(88vw,420px);background:#fbe7b5;border:5px solid #8a4b1e;outline:4px solid #5a2f10;border-radius:6px;box-shadow:inset 0 0 0 4px #f3cf86,0 8px 0 #5a2f10;padding:24px 18px 18px;text-align:center;animation:unfold .4s steps(5,end) both}
.note-t{font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.8;color:#9b2f45;margin:0 0 12px}
.note-b{font-family:'Courier New',ui-monospace,monospace;font-weight:700;font-size:clamp(17px,4.6vw,20px);line-height:1.4;color:#4a2a10;margin:0 0 18px}

/* ambient */
.amb{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.amb .spr{position:absolute}
.rise{animation:rise linear forwards}
@keyframes rise{from{transform:translate(0,0)}50%{transform:translate(16px,-55vh)}to{transform:translate(-8px,-115vh)}}
.fall{animation:fall linear forwards}
@keyframes fall{from{transform:translate(0,0) rotate(0)}50%{transform:translate(28px,55vh) rotate(160deg)}to{transform:translate(-10px,112vh) rotate(320deg)}}
.bf{position:absolute;animation:fly linear infinite}
.bf .spr{position:absolute;left:0;top:0}
.bf .f1{animation:fl1 .5s steps(1,end) infinite}
.bf .f2{animation:fl2 .5s steps(1,end) infinite}
@keyframes fl1{0%{opacity:1}50%{opacity:0}}
@keyframes fl2{0%{opacity:0}50%{opacity:1}}
@keyframes fly{0%{transform:translate(-60px,0)}25%{transform:translate(28vw,-40px)}50%{transform:translate(55vw,30px)}75%{transform:translate(82vw,-30px)}100%{transform:translate(112vw,10px)}}


/* ===================== wide screens: iPad landscape + desktop (its own composition) ===================== */
@media (min-width:700px) and (min-aspect-ratio:5/4){
  :root{--fw:min(calc(100vw - 28px),1400px,calc(var(--vh)*133));--ftop:calc(var(--vh)*7 + (var(--vh)*92 - var(--fw)*.69)/2);--hor:calc(var(--ftop) + var(--fw)*.69*.15)}
  .ui{max-width:none;justify-content:center;padding:calc(var(--vh)*7) 14px calc(var(--vh)*1);gap:0}
  .sign{position:absolute;margin:0;width:calc(var(--fw)*.38);z-index:300;left:calc(50% - var(--fw)/2 + var(--fw)*.02);top:calc(var(--ftop) + var(--fw)*.0104)}
  .farm{width:var(--fw);aspect-ratio:1/.69}

/* very short landscape screens (phones turned sideways) */
@media (orientation:landscape) and (max-height:520px){
  .sv{max-height:94vh;padding:8px}
  .sv-in{padding:14px 14px 8px}
  #lbody p{font-size:20px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;animation-delay:0s!important}

}
